<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom of Science — Full Roster</title>
<style>
[data-theme="light"] {
  --bg0:#f0f2f5; --bg:#ffffff; --bg2:#f3f4f6; --bg3:#e5e7eb;
  --bg-info:#eff6ff; --bg-quote:#f0f7ff;
  --t1:#111827; --t2:#4b5563; --t3:#9ca3af; --ti:#1d4ed8;
  --b1:#e5e7eb; --b2:#d1d5db; --bi:#93c5fd;
  --shadow:rgba(0,0,0,.07); --overlay:rgba(0,0,0,.4);
  --km-border:#d1d5db;
}
[data-theme="dark"] {
  --bg0:#0d1117; --bg:#161b22; --bg2:#21262d; --bg3:#30363d;
  --bg-info:#1c2a3a; --bg-quote:#192030;
  --t1:#e6edf3; --t2:#8b949e; --t3:#484f58; --ti:#79c0ff;
  --b1:#30363d; --b2:#3d444d; --bi:#1f6feb;
  --shadow:rgba(0,0,0,.4); --overlay:rgba(0,0,0,.7);
  --km-border:#30363d;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg0);min-height:100vh;padding:1.5rem;color:var(--t1);transition:background .3s,color .3s}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:1rem}
.header h1{font-size:22px;font-weight:700;color:var(--t1)}
.header p{font-size:13px;color:var(--t3);margin-top:3px}

.toggle{display:flex;align-items:center;gap:8px;padding:7px 15px;border-radius:20px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background .2s,border-color .2s,color .2s}
.toggle:hover{border-color:var(--t3)}
.toggle-icon{font-size:15px;line-height:1}

.controls{background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px var(--shadow);transition:background .3s,border-color .3s}

.search input{width:100%;padding:9px 13px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-family:inherit;margin-bottom:.9rem;outline:none;transition:background .3s,border-color .2s,color .3s}
.search input:focus{border-color:var(--bi);background:var(--bg)}
.search input::placeholder{color:var(--t3)}

.row-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.85rem}

.btn{padding:5px 13px;border-radius:20px;font-size:12px;border:1px solid var(--b2);cursor:pointer;background:var(--bg2);color:var(--t2);font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--t3)}
.btn.active{background:var(--bg-info);color:var(--ti);border-color:var(--bi);font-weight:600}

[data-theme="light"] .btn.active.combat   {background:#fde8e8;color:#c0392b;border-color:#c0392b}
[data-theme="light"] .btn.active.utility  {background:#e8f9f2;color:#1D9E75;border-color:#1D9E75}
[data-theme="light"] .btn.active.lead     {background:#fef3e8;color:#BA7517;border-color:#BA7517}
[data-theme="light"] .btn.active.charisma {background:#f3e8fe;color:#7C3AED;border-color:#7C3AED}
[data-theme="light"] .btn.active.intel    {background:#e8f0fe;color:#1a56cc;border-color:#1a56cc}

[data-theme="dark"] .btn.active.combat   {background:#3d1212;color:#f87171;border-color:#7f1d1d}
[data-theme="dark"] .btn.active.utility  {background:#0d2e1e;color:#34d399;border-color:#065f46}
[data-theme="dark"] .btn.active.lead     {background:#2e1f05;color:#fbbf24;border-color:#78350f}
[data-theme="dark"] .btn.active.charisma {background:#1f0d3a;color:#c084fc;border-color:#6b21a8}
[data-theme="dark"] .btn.active.intel    {background:#0d1b38;color:#60a5fa;border-color:#1e3a8a}

.filter-row{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:4px 11px;border-radius:20px;font-size:11px;border:1px solid var(--b2);cursor:pointer;background:var(--bg2);color:var(--t2);font-family:inherit;transition:all .15s}
.pill.active{background:var(--bg-info);color:var(--ti);border-color:var(--bi);font-weight:600}

.count{font-size:12px;color:var(--t3);margin:.6rem 0}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:1rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .3s}
.card:hover{border-color:var(--b2);box-shadow:0 2px 10px var(--shadow)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.card-name{font-size:13px;font-weight:600;color:var(--t1);line-height:1.3}
.card-role{font-size:11px;color:var(--t2);margin-top:1px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin:2px 2px 0 0;background:var(--bg2);color:var(--t2);border:1px solid var(--b1);transition:background .3s}

/* RANK */
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:.65rem 1rem;cursor:pointer;transition:border-color .15s,background .3s}
.rank-row:hover{border-color:var(--b2)}
.rnum{font-size:13px;font-weight:700;color:var(--t3);width:28px;text-align:center;flex-shrink:0}
.rnum.gold{color:#f5a623}.rnum.silver{color:#9ca3af}.rnum.bronze{color:#cd7f32}
.rav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rname{font-size:13px;font-weight:600;color:var(--t1)}
.rrole{font-size:11px;color:var(--t2)}
.rright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:82px}
.rscore{font-size:17px;font-weight:700}
.rbarbg{width:82px;height:5px;background:var(--bg3);border-radius:3px}
.rbar{height:5px;border-radius:3px}
.rlabel{font-size:10px;color:var(--t3)}

/* PANEL */
.overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;align-items:flex-start;justify-content:center;padding:1.5rem;overflow-y:auto}
.overlay.open{display:flex}
.panel{background:var(--bg);border-radius:14px;border:1px solid var(--b1);padding:1.75rem;max-width:580px;width:100%;margin:auto;box-shadow:0 8px 40px var(--shadow);transition:background .3s,border-color .3s}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:1.25rem}
.lgav{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.pname{font-size:21px;font-weight:700;color:var(--t1)}
.pmeta{font-size:12px;color:var(--t3);margin-top:3px}
.sec{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:1.1rem 0 .45rem}
.desc{font-size:13px;color:var(--t2);line-height:1.75}
.chip{display:inline-block;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--t2);margin:2px;transition:background .3s}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.5rem}
.sbox{background:var(--bg2);border-radius:8px;padding:.65rem .85rem;border:1px solid transparent;transition:background .3s}
.slbl{font-size:10px;color:var(--t3);margin-bottom:2px}
.sval{font-size:13px;font-weight:700}
.bbg{margin-top:.3rem;height:4px;background:var(--b1);border-radius:2px}
.bfill{height:4px;border-radius:2px}
.quote{border-left:3px solid var(--bi);padding:.6rem .9rem;margin:.5rem 0;font-size:13px;color:var(--t1);font-style:italic;line-height:1.6;font-weight:500;background:var(--bg-quote);border-radius:0 6px 6px 0;transition:background .3s}
.km{background:var(--bg2);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--t2);margin:3px 0;line-height:1.55;border-left:3px solid var(--km-border);transition:background .3s}
.closebtn{margin-top:1.25rem;width:100%;padding:9px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:background .15s}
.closebtn:hover{background:var(--bg3)}
.empty{text-align:center;color:var(--t3);padding:2.5rem;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚗️ Kingdom of Science — Full Roster</h1>
    <p>Dr. Stone · Click any member to view their full profile</p>
  </div>
  <button class="toggle" onclick="toggleTheme()" id="toggle-btn">
    <span class="toggle-icon" id="t-icon">🌙</span>
    <span id="t-label">Dark mode</span>
  </button>
</div>

<div class="controls">
  <div class="search"><input type="text" id="search" placeholder="Search by name, role, or skill..." oninput="render()"></div>
  <div class="row-label">View</div>
  <div class="btn-row">
    <button class="btn active" id="btn-grid" onclick="setMode('grid')">Grid</button>
    <button class="btn" id="btn-rank" onclick="setMode('rank')">Ranking</button>
  </div>
  <div id="sort-wrap" style="display:none">
    <div class="row-label">Sort by stat</div>
    <div class="btn-row">
      <button class="btn active" id="sort-overall"      onclick="setSort('overall')">Overall</button>
      <button class="btn intel"  id="sort-intelligence" onclick="setSort('intelligence')">Intelligence</button>
      <button class="btn combat" id="sort-combat"       onclick="setSort('combat')">Combat</button>
      <button class="btn utility" id="sort-utility"     onclick="setSort('utility')">Utility</button>
      <button class="btn lead"    id="sort-leadership"  onclick="setSort('leadership')">Leadership</button>
      <button class="btn charisma" id="sort-charisma"   onclick="setSort('charisma')">Charisma</button>
    </div>
  </div>
  <div class="row-label">Filter by group</div>
  <div class="filter-row" id="filters"></div>
</div>

<div class="count" id="count"></div>
<div id="content"></div>

<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="panel" id="panel"></div>
</div>

<script>
// ── THEME ──────────────────────────────────────────────
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute("data-theme")==="dark";
  const next=dark?"light":"dark";
  html.setAttribute("data-theme",next);
  document.getElementById("t-icon").textContent=next==="dark"?"☀️":"🌙";
  document.getElementById("t-label").textContent=next==="dark"?"Light mode":"Dark mode";
  try{localStorage.setItem("ks-theme",next);}catch(e){}
}
(function(){
  try{
    const s=localStorage.getItem("ks-theme");
    if(s){
      document.documentElement.setAttribute("data-theme",s);
      document.getElementById("t-icon").textContent=s==="dark"?"☀️":"🌙";
      document.getElementById("t-label").textContent=s==="dark"?"Light mode":"Dark mode";
    }
  }catch(e){}
})();

// ── COLOURS ────────────────────────────────────────────
const SC={overall:"#378ADD",intelligence:"#1a56cc",combat:"#c0392b",utility:"#1D9E75",leadership:"#BA7517",charisma:"#7C3AED"};
function barC(v){return v>=85?"#1D9E75":v>=65?"#378ADD":v>=40?"#BA7517":"#D85A30";}

// ── DATA ───────────────────────────────────────────────
const M=[
  // CORE FOUNDERS
  {n:"Senku Ishigami",i:"SI",bg:"#B5D4F4",fg:"#0C447C",g:"Core Founders",j:"Chapter 1",st:"Leader",r:"Chief Scientist & Leader",arch:"Genius Strategist",q:["\"This is exhilarating. Get excited!\"","\"It's not that there are things science can't explain. You just look for the rules behind those things. Science is just a name for the steady, pain-in-the-ass effort that goes into that.\"","\"There is no such thing as a 'useless' person in the Kingdom of Science.\""],ov:"Senku is the unquestioned heart and brain of the Kingdom of Science. Born with an encyclopedic memory and insatiable curiosity, he spent his childhood studying every field of science simultaneously. When the petrification event struck, he spent 3,700 years counting in his head to preserve consciousness — a feat of will nearly unmatched in the series. His philosophy: science will always beat brute force, and every problem has a solution waiting to be calculated.",per:"Outwardly cold and calculating, Senku actually cares deeply for everyone around him, expressing it through feats rather than words. He has zero tolerance for superstition and absolute confidence in the scientific method. He never gives up on a problem and treats every obstacle as a puzzle worth solving.",cr:"Non-combatant. Avoids direct fighting entirely, relying on inventions and allies to protect him. Has shown surprising resourcefulness in life-threatening situations.",kc:["Developed the revival formula to de-petrify humans","Invented gunpowder, glass, antibiotics, electricity, radios, ships, phones, and eventually rockets","Engineered the defeat of every major antagonist through strategy rather than force","Created the roadmap for returning modern civilization from zero","Designed the Perseus — the Kingdom's ocean-going research vessel"],s:{i:100,c:10,u:100,l:90,ch:70},sk:["Chemistry","Physics","Biology","Medicine","Engineering","Electricity","Strategy","Invention","Material science","Astronomy"],w:"Physically frail — completely dependent on allies for protection in battle."},
  {n:"Taiju Oki",i:"TO",bg:"#C0DD97",fg:"#3B6D11",g:"Core Founders",j:"Chapter 1",st:"Active",r:"Stamina Powerhouse & Labor Specialist",arch:"Gentle Giant",q:["\"I am in love with Yuzuriha!\"","\"I will do the heavy lifting!\"","\"I don't have the strength to fight, and I don't have the brains to lead. But I have the heart to keep going until the job is done.\""],ov:"Taiju is Senku's best friend since childhood and one of the first humans to be de-petrified. While he possesses no scientific knowledge, his value to the Kingdom is enormous: his endurance is superhuman, he can labor indefinitely without rest, and his unbreakable spirit keeps morale high even in the darkest moments.",per:"Boisterous, earnest, and emotionally intense. He wears his heart on his sleeve — his love for Yuzuriha is his defining motivation. He is honest to a fault and finds it nearly impossible to lie, making him a poor spy but an ideal moral anchor.",cr:"Non-combatant. Refuses to fight people. His sheer physical durability means he can absorb punishment and keep moving in ways others cannot.",kc:["His tears (sodium hydroxide) were the key ingredient in the early revival fluid","Operated nital-soaking on thousands of petrified statues during Tsukasa's Empire phase","Powered early Kingdom labor — clearing land, mixing chemicals, physical construction","Served as Yuzuriha's partner inside Tsukasa's Empire, secretly repairing statues","Emotional foundation of the group during the earliest and hardest chapters"],s:{i:20,c:30,u:85,l:40,ch:75},sk:["Superhuman stamina","Manual labor","Physical endurance","Emotional strength","Honesty","Loyalty"],w:"Cannot fight people — a strict personal code. No scientific knowledge and poor deception ability."},
  {n:"Yuzuriha Ogawa",i:"YO",bg:"#F4C0D1",fg:"#72243E",g:"Core Founders",j:"Chapter 1",st:"Active",r:"Crafting Specialist & Infiltration Operative",arch:"Quiet Mastermind",q:["\"Craft is all about perseverance!\""],ov:"Yuzuriha is often underestimated but is one of the most strategically valuable members of the Kingdom. Her fine motor skills and artistic precision make her the go-to fabricator for delicate tasks. More critically, her emotional intelligence and composure under pressure allowed her to execute one of the most dangerous undercover missions in the series — secretly reassembling petrified statues inside Tsukasa's Empire.",per:"Gentle, composed, and quietly determined. She is deeply in love with Taiju and balances his exuberance with calm steadiness. She can withstand extreme psychological pressure without breaking.",cr:"Non-combatant. Relies on stealth, deception, and allies for protection.",kc:["Secretly repaired thousands of shattered petrified statues inside Tsukasa's Empire","Fabricated thread, rope, and textiles essential to early Kingdom production","Provided Senku with intelligence from deep inside enemy territory","Critical to early clothing and material production"],s:{i:65,c:10,u:80,l:40,ch:60},sk:["Fine motor skills","Weaving & textiles","Infiltration","Composure under pressure","Memory","Artistry","Emotional intelligence"],w:"Limited combat ability. Best utilized in support and stealth roles."},
  // ISHIGAMI VILLAGE
  {n:"Chrome",i:"CH",bg:"#FAC775",fg:"#633806",g:"Ishigami Village",j:"Chapter 10",st:"Active",r:"Field Scientist & Mineral Specialist",arch:"Born Scientist",q:["\"I am a sorcerer!\"","\"Damn! (Yabe!)\"","\"Science is the only way to level the playing field between a genius and a regular person.\""],ov:"Chrome is arguably the most important discovery Senku makes in the stone world. A self-taught collector of minerals, he had been conducting proto-scientific experiments for years before meeting Senku. Under Senku's tutelage he rapidly becomes the Kingdom's second-best scientist and most capable field operator.",per:"Energetic, passionate, and fiercely competitive with Senku intellectually. Deeply brave — Chrome's willingness to risk his life for the mission is unmatched even among combat members.",cr:"Limited combatant. Not a trained fighter but has shown extraordinary bravery and improvisation in life-threatening situations, including deliberately getting captured to gather intelligence.",kc:["Pre-accumulated mineral collection that jumpstarted resource gathering","Improvised a primitive battery inside Tsukasa's prison","Identified key ores and compounds across multiple arcs","Assisted in nearly every major chemical synthesis","Held the Kingdom together scientifically when Senku was incapacitated"],s:{i:80,c:35,u:88,l:55,ch:65},sk:["Mineral identification","Field chemistry","Scientific improvisation","Bravery","Problem-solving","Resource gathering"],w:"Scientific knowledge remains a step behind Senku in formal depth."},
  {n:"Kohaku",i:"KO",bg:"#9FE1CB",fg:"#085041",g:"Ishigami Village",j:"Chapter 10",st:"Active",r:"Elite Warrior & Chief Scout",arch:"Lionhearted Fighter",q:["\"I will protect everyone — that is what I decided.\"","\"My blade may find that sharp tongue of yours before either of us knows it.\"","\"I believe in Senku!\""],ov:"Kohaku is the Kingdom's primary combat asset for most of the series. Daughter of village chief Kokuyo and sister of Ruri, she was already the strongest fighter in Ishigami Village long before Senku arrived. She carries herself with the mentality of a warrior who has accepted that protecting people is her entire purpose.",per:"Direct, fiery, and fiercely loyal. No patience for deception or politics. Surprisingly emotionally perceptive when it comes to those she cares about.",cr:"Primary frontline fighter. Exceptional speed, strength, endurance, and combat IQ. Trained in spear and hand-to-hand combat. Regularly takes on opponents far larger than herself.",kc:["Personally rescued and guarded Senku in his earliest days","Served as primary combat escort during nearly every dangerous expedition","Key operative in multiple infiltration missions","Held the line in village defense against Tsukasa's forces","Scouted terrain and enemy positions across multiple arcs"],s:{i:55,c:92,u:70,l:65,ch:72},sk:["Hand-to-hand combat","Spear fighting","Tracking","Scouting","Stealth","Endurance","Tactical awareness","Swimming","Wilderness survival"],w:"Emotional investment in allies can cloud judgment. Limited scientific knowledge."},
  {n:"Kaseki",i:"KA",bg:"#CECBF6",fg:"#3C3489",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Master Craftsman & Chief Fabricator",arch:"The Artisan",q:["\"Incredible... this is incredible!\"","\"Now you've got me fired up!\""],ov:"Kaseki is the Kingdom's most essential non-scientist. Every physical invention Senku designs has to be built by someone — and that someone is almost always Kaseki. He can work with glass, metal, wood, ceramic, and stone at a precision no one else in the stone world comes close to.",per:"Initially reluctant and private, Kaseki becomes one of the most enthusiastic members once his passion is ignited. Almost childlike with joy when presented with a new engineering challenge.",cr:"Non-combatant. Occasionally uses his enormous craftsman's strength in emergencies.",kc:["Fabricated the Kingdom's first functional glass vessels","Built the cotton gin, lathe, steam engine components, and phone components","Constructed structural elements of the Perseus","Crafted weapons, armor, and scientific instruments across every arc","Produced every piece of glassware used in chemical synthesis"],s:{i:60,c:15,u:97,l:30,ch:50},sk:["Glassblowing","Metalworking","Woodworking","Stone carving","Precision fabrication","Engineering intuition","Structural design"],w:"Age limits physical endurance. No combat ability. Dependent on Senku for direction."},
  {n:"Suika",i:"SU",bg:"#B5D4F4",fg:"#0C447C",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Scout, Stealth Operative & Emotional Heart",arch:"The Underdog",q:["\"I want to be useful!\""],ov:"Suika hides her face in a hollowed watermelon functioning as a rudimentary lens for her severe nearsightedness. Consistently underestimated — and consistently proves those estimations wrong. She has one of the most significant solo arcs in the entire manga.",per:"Kind, deeply empathetic, and quietly determined. She desperately wants to contribute and finds ways to be pivotal in nearly every arc.",cr:"Non-combatant early on. Her solo arc required surviving alone, producing revival fluid, and reviving Senku single-handedly.",kc:["Served as primary recon scout due to small size","Smuggled critical items and information during missions","Solo survival arc: revived Senku single-handedly","Emotional anchor for younger village members"],s:{i:55,c:20,u:72,l:35,ch:70},sk:["Stealth","Scouting","Small-space infiltration","Resourcefulness","Emotional intelligence","Resilience","Improvisation"],w:"Small size and nearsightedness limit confrontation. Lacks combat training."},
  {n:"Kinro",i:"KI",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Disciplined Guard & Frontline Fighter",arch:"The Rule-Keeper",q:["\"Rules exist for a reason.\"","\"Rules are rules.\""],ov:"Kinro is the elder of the two village guard brothers. An exceptional fighter who becomes significantly more effective once Senku's glasses fix the nearsightedness hampering him his entire life. Defined by rigid adherence to rules and order.",per:"Stoic, dutiful, and stubborn. Takes his responsibilities with absolute seriousness. Beneath the rigid exterior is genuine care for the village and his brother.",cr:"Strong frontline fighter. Specializes in spear combat. Becomes one of the more dangerous fighters in the village after his vision is corrected.",kc:["Defended Ishigami Village as primary guard","Competed in the Grand Bout","Served on the Perseus as a combat operative","His glasses moment is a key example of science improving lives"],s:{i:40,c:75,u:55,l:45,ch:40},sk:["Spear combat","Discipline","Reliability","Guard duty","Physical strength","Loyalty","Adaptability (post-glasses)"],w:"Rigid thinking. Struggles to act outside established rules."},
  {n:"Ginro",i:"GI",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Guard & Reluctant Hero",arch:"Comic Relief with Hidden Depth",q:["\"I don't wanna do this!\"","\"Secret Technique: Leave It To Somebody Else!\""],ov:"Ginro is Kinro's younger brother and the series' most reliable source of comic relief — cowardly, status-obsessed, self-serving, yet somehow keeps ending up in the middle of crucial moments. More capable than he lets on with an unexpected clutch factor.",per:"Vain, dramatic, and self-serving — but ultimately good-hearted. Terrified of danger yet circumstances continue to place him at critical junctures.",cr:"Capable spear fighter, faster than Kinro. His swimming ability becomes plot-critical in the Petrification Kingdom arc.",kc:["Participated in the Grand Bout","Played a key underwater role during the Petrification Kingdom arc","Provides irreplaceable morale via comic relief","Bonded with Matsukaze"],s:{i:35,c:68,u:50,l:20,ch:55},sk:["Spear combat","Speed","Swimming","Improvisation under panic","Comic timing"],w:"Cowardice and self-interest frequently undermine effectiveness."},
  {n:"Ruri",i:"RU",bg:"#F4C0D1",fg:"#72243E",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Village Chief & Living Knowledge Archive",arch:"The Oracle",q:["— (Her value is in what she remembers)"],ov:"Ruri is Kohaku's older sister and the priestess of Ishigami Village. She fulfills her sacred duty: memorizing and passing on the '100 Tales' — stories encoded by Byakuya with the entirety of modern humanity's most important knowledge, designed so Senku would one day decode them.",per:"Gentle, serene, and deeply wise. She carries the weight of the village's spiritual and intellectual legacy without complaint.",cr:"Non-combatant. Her value is entirely knowledge-based.",kc:["Preserved and transmitted the '100 Tales'","Provided historical and scientific context encoded by Byakuya","Served as moral and spiritual center of Ishigami Village","Her recovery via sulfa drugs was the first proof of Senku's medical capabilities"],s:{i:70,c:5,u:78,l:55,ch:75},sk:["100 Tales memorization","Historical knowledge","Spiritual leadership","Medical knowledge (encoded)","Wisdom","Village authority"],w:"Chronically ill before treatment. No combat ability."},
  {n:"Magma",i:"MA",bg:"#F0997B",fg:"#712B13",g:"Ishigami Village",j:"Chapter 35",st:"Active",r:"Heavy Combat Asset & Muscle",arch:"Redeemed Bully",q:["\"I don't get science, but I get hitting things.\"","\"Just kill them.\""],ov:"Magma begins as the primary village antagonist. After his defeat and exposure to the Kingdom's world, he undergoes genuine character growth. Not intelligent in a traditional sense but shrewd, tough, and becomes genuinely loyal over time.",per:"Blunt, straightforward, and initially self-serving. His humor comes from complete honesty about his own motivations and limitations.",cr:"One of the Kingdom's most powerful pure fighters. Enormous physical strength. Useful for mining, tunneling, heavy labor, and close-quarters combat.",kc:["Served as primary heavy combatant","Performed critical mining and tunneling work","Participated in the Perseus voyage","His blunt assessments occasionally cut through overthinking"],s:{i:25,c:80,u:60,l:20,ch:35},sk:["Brute strength","Close combat","Mining","Tunneling","Physical endurance","Intimidation"],w:"Low intelligence and poor strategic thinking. No technical or scientific skills."},
  {n:"Kokuyo",i:"KK",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Village Elder & Authority Figure",arch:"The Patriarch",q:["— (A man of few words, much respect)"],ov:"Kokuyo is the chief and elder of Ishigami Village, father of Kohaku and Ruri. A large, powerful man who has held the village together through wisdom and authority. Initially resistant to Senku's arrival, he becomes a crucial supporter once he sees what science can do for his people.",per:"Reserved, dignified, and protective. Places the wellbeing of his village above everything. Not easily swayed, meaning his approval carries significant weight.",cr:"Strong for his age. Functions more as an authority figure than an active combatant.",kc:["Legitimized Senku's authority within Ishigami Village","United the village behind the Kingdom of Science","Provided structural leadership during Senku's absences"],s:{i:55,c:60,u:55,l:80,ch:65},sk:["Village authority","Leadership","Wisdom","Community management","Physical strength (historical)"],w:"Not a scientific contributor. Age limits physical capability."},
  // DEFECTORS
  {n:"Gen Asagiri",i:"GA",bg:"#F5C4B3",fg:"#712B13",g:"Defectors",j:"Chapter 40",st:"Active",r:"Mentalist, Negotiator & Psychological Operative",arch:"The Schemer",q:["\"I'm a modern, science-loving sheep.\"","\"Senku-chan~♫\"","\"No matter which one of you falls, I'll be riding the winning horse.\""],ov:"Gen Asagiri is the most strategically valuable non-fighter in the Kingdom. A professional mentalist from the modern era, his understanding of human behavior, manipulation, and persuasion is without peer. He defected from Tsukasa's side because Senku offered him cola — yet became one of the Kingdom's most indispensable and genuinely loyal members.",per:"Theatrical, witty, and deeply self-aware. Gen is always performing — but underneath is a person who genuinely grew to love the Kingdom's cause. Cowardly in physical danger but ice-cold under psychological pressure.",cr:"Non-combatant. His ability to deceive and manipulate enemies can neutralize threats without a single punch being thrown.",kc:["Defected and brought inside knowledge of Tsukasa's Empire","Impersonated Lillian Weinberg to swing the loyalty of Tsukasa's forces","Negotiated Ukyo's defection — massively shifting the Kingdom's combat power","Managed internal group morale through every low point","Served as primary intelligence operative and social engineer across every arc"],s:{i:82,c:5,u:92,l:50,ch:100},sk:["Psychological manipulation","Deception","Cold reading","Impersonation","Negotiation","Morale management","Social engineering","Showmanship"],w:"Physically useless in direct combat. Loyalty required time to solidify."},
  {n:"Ukyo Saionji",i:"US",bg:"#C0DD97",fg:"#3B6D11",g:"Defectors",j:"Chapter 80",st:"Active",r:"Sonar Scout & Precision Archer",arch:"The Pacifist Soldier",q:["\"I won't let anyone die — not even the enemy.\""],ov:"Ukyo's hearing is so extraordinarily developed that he can detect heartbeats, count people, and map positions at long range — functioning as a living sonar system. A trained archer of exceptional precision. He defected when he confirmed Senku wasn't killing people.",per:"Calm, thoughtful, and principled. His absolute refusal to kill is a genuine philosophical commitment, not weakness.",cr:"Ranged specialist. Archery is surgical — disabling opponents without killing at significant range. Hearing makes him nearly impossible to ambush.",kc:["Provided real-time enemy position data using sonar-level hearing","Served as primary ranged combat support","His defection changed the Kingdom's combat power significantly","Detected the Why-Man signal from the moon"],s:{i:72,c:82,u:85,l:50,ch:58},sk:["Superhuman hearing","Archery","Non-lethal combat","Sonar detection","Recon","Stealth","Situational awareness"],w:"Pacifism limits combat effectiveness in extreme situations."},
  {n:"Nikki Hanada",i:"NH",bg:"#F4C0D1",fg:"#72243E",g:"Defectors",j:"Chapter 85",st:"Active",r:"Combat Guard & Voice Authentication Specialist",arch:"The Superfan Soldier",q:["\"Lillian Weinberg is a goddess.\""],ov:"Nikki is a powerfully built former MMA fighter. Her most critical contribution was entirely unexpected: she was such a devoted fan of Lillian Weinberg that she could authenticate whether a voice truly sounded like Lillian's — the linchpin of one of Gen's most audacious deceptions.",per:"Tough on the exterior, deeply sentimental beneath. Direct, loyal, and surprisingly emotionally open once she trusts people.",cr:"Powerful physical fighter. MMA background gives her a well-rounded combat skillset. Serves primarily as a guard.",kc:["Authenticated the Lillian voice performance — most critical moment of the anti-Tsukasa arc","Transitioned loyalty of several Empire members to the Kingdom","Reliable front-line guard on expeditions"],s:{i:40,c:78,u:55,l:35,ch:50},sk:["MMA combat","Physical strength","Guard duty","Voice authentication","Loyalty","Emotional conviction"],w:"Limited scientific or strategic value outside of combat."},
  {n:"Minami Hokutozai",i:"MH",bg:"#B5D4F4",fg:"#0C447C",g:"Defectors",j:"Chapter 85",st:"Active",r:"Journalist, Photographer & Media Strategist",arch:"The Documentarian",q:["\"This is the scoop of human history.\""],ov:"Minami understands the power of information and narrative better than almost anyone in the group. She handles all visual documentation of the Kingdom's progress and understands how to frame the Kingdom's story for maximum impact.",per:"Sharp, observant, and professionally focused. Has the journalist's instinct for the telling detail.",cr:"Non-combatant. Her value is informational and archival.",kc:["Manages all photographic and written documentation","Produced communications and propaganda materials","Provided intelligence on Tsukasa's Empire before defecting"],s:{i:68,c:10,u:70,l:30,ch:60},sk:["Photography","Documentation","Media strategy","Information warfare awareness","Journalism","Archiving"],w:"Non-combatant. Support role only."},
  {n:"Yo Uei",i:"YU",bg:"#D3D1C7",fg:"#444441",g:"Defectors",j:"Chapter 85",st:"Active",r:"Guard & Former Police Officer",arch:"The Opportunist",q:["\"I'm just in it for myself — don't get me wrong.\""],ov:"Yo is a former police officer who joined largely because the Kingdom seemed to be winning. Openly self-serving, frequently cowardly, never misses an opportunity to complain — yet consistently pulls through when the situation demands it.",per:"Lazy, sardonic, and aggressively self-interested. The group's most honest mercenary — doesn't pretend to be noble.",cr:"Capable close-quarters fighter with police training. Comfortable with firearms. Serves primarily as a guard.",kc:["Provided guard duty across multiple arcs","Law enforcement instincts useful in tense confrontations","Comic relief that keeps the group's tone balanced"],s:{i:38,c:65,u:52,l:15,ch:40},sk:["Police combat training","Guard duty","Firearms familiarity","Threat assessment","Self-preservation instincts"],w:"Self-serving and unreliable without clear personal stakes."},
  // MODERN REVIVALS
  {n:"Ryusui Nanami",i:"RN",bg:"#FAC775",fg:"#633806",g:"Modern Revivals",j:"Chapter 100",st:"Active",r:"Navigator, Helmsman & Patron",arch:"The Aristocrat",q:["\"I want it all — every last bit of this world!\"","\"I desire it!\""],ov:"Ryusui is revived specifically because Senku needs a navigator. Heir to a vast shipping empire who mastered every watercraft discipline and sailed every ocean. Arrogant and flamboyant, his greed applies equally to experiences as to wealth.",per:"Supremely confident and unapologetically self-indulgent. His greed paradoxically aligns perfectly with the Kingdom's ambition to rebuild all of civilization.",cr:"Limited combatant. Value is almost entirely navigational and logistical.",kc:["Designed and commanded the Perseus","Navigated the global voyage using astronomical calculation","Introduced currency into the Kingdom's economy","Piloted aircraft during the later arcs"],s:{i:75,c:40,u:90,l:70,ch:85},sk:["Navigation","Sailing","Piloting (air and sea)","Celestial navigation","Meteorology","Ship design","Economics"],w:"Arrogance can create friction. Limited outside maritime and aviation contexts."},
  {n:"Francois",i:"FR",bg:"#9FE1CB",fg:"#085041",g:"Modern Revivals",j:"Chapter 100",st:"Active",r:"Butler, Chef & Logistics Master",arch:"The Perfect Servant",q:["\"Leave it to me.\"","\"Desire = Justice!\""],ov:"Francois is Ryusui's personal butler, revived alongside him. A world-class culinary expert and logistics specialist whose contributions directly affect the crew's performance. Never complains, never fails a task, never needs to be told something twice.",per:"Perfectly composed. Expresses personality entirely through excellence of craft. Kind and observant, attuned to what people need before they know it themselves. Identifies as gender-neutral.",cr:"Non-combatant. Support role only.",kc:["Managed all food production and nutrition for the Perseus crew","Handled all supply logistics","Maintained crew morale through exceptional cooking","Enabled Ryusui to focus entirely on navigation"],s:{i:70,c:5,u:88,l:35,ch:65},sk:["Culinary mastery","Logistics","Supply management","Nutrition science","Crew morale","Organization"],w:"Non-combatant. Value is almost entirely support-based."},
  {n:"Chelsea",i:"CE",bg:"#FAC775",fg:"#633806",g:"Modern Revivals",j:"Chapter 195",st:"Active",r:"Geographer & Global Navigation Expert",arch:"The Scholar",q:["\"I can tell exactly where we are just from the landscape.\""],ov:"Chelsea is a modern-era geographer revived for the Kingdom's global ambitions. Her ability to identify locations from terrain features and navigate using landscape knowledge is essential once the group travels to distant regions.",per:"Enthusiastic about geography and terrain in a way others find endearing. Confident in her area of expertise, curious and adaptable.",cr:"Non-combatant.",kc:["Identified terrain and landmarks during international travel","Provided geological analysis to support resource location","Land-based geography expertise complementing Ryusui's maritime focus"],s:{i:72,c:5,u:68,l:25,ch:50},sk:["Geography","Terrain identification","Geological analysis","Land navigation","Landmark recognition","Map-reading"],w:"Narrow specialization. Limited outside geographic contexts."},
  {n:"Sai Ogasawara",i:"SA",bg:"#B5D4F4",fg:"#0C447C",g:"Modern Revivals",j:"Chapter 180",st:"Active",r:"Mathematics Prodigy & Computing Specialist",arch:"The Human Computer",q:["\"Numbers don't lie — let me work it out.\""],ov:"Sai is Yuzuriha's older brother and one of the most intellectually gifted people in the series in his specific domain. A prodigious mathematician who can perform calculations of staggering complexity entirely in his head, revived to fill the Kingdom's critical gap in computing power. Before modern computers can be rebuilt, Sai effectively functions as one.",per:"Socially detached and hyper-focused, but deeply affectionate toward Yuzuriha in his own way. Not arrogant about his gift — he simply doesn't fully understand why others find calculations difficult.",cr:"Non-combatant. His battlefield is mathematics.",kc:["Provided manual computing power for navigation, astronomy, and engineering calculations","Enabled precision in the Kingdom's later technological projects","His mental arithmetic replaced entire computational systems during key arcs","Assisted Senku and Xeno with physics and engineering calculations","Reconnected with Yuzuriha — one of the story's quieter emotional threads"],s:{i:98,c:5,u:85,l:20,ch:38},sk:["Mental arithmetic","Mathematical modeling","Physics calculations","Navigational computing","Astronomical mathematics","Pattern recognition","Precise memory"],w:"Virtually useless outside of mathematics and computing contexts. No combat ability."},
  // FORMER ENEMIES
  {n:"Tsukasa Shishio",i:"TS",bg:"#CECBF6",fg:"#3C3489",g:"Former Enemies",j:"Chapter 130",st:"Active",r:"Strongest Primate High Schooler & Military Commander",arch:"The Noble Villain Redeemed",q:["\"I want a world where the strong protect the weak.\"","\"I will kill you, Senku. But I will not lie to you.\"","\"You can call it killing, if you want. I'm culling humanity, for the sake of a new world.\""],ov:"Tsukasa is the series' first major antagonist — a national champion MMA fighter who is physically the most powerful human in the story. His ideology stems from a traumatic childhood experience. He is not evil; he is terribly, sincerely wrong. His arc from enemy to genuine member is one of the story's emotional peaks.",per:"Calm, dignified, and deeply principled. Operates with a quiet intensity more frightening than rage. Genuinely kind to children and the vulnerable. After being saved, he directs that intensity entirely toward the Kingdom's mission.",cr:"The single most powerful fighter in the series for most of its run. Superhuman strength, speed, and durability. Functions as a one-man army.",kc:["Served as the Kingdom's ultimate combat deterrent after joining","Commanded military strategy during the American arc coalition","Led combined forces during the final phases of the story"],s:{i:70,c:100,u:75,l:88,ch:82},sk:["Unmatched hand-to-hand combat","Hunting","Tactical command","Superhuman strength","Superhuman speed","Leadership","Stone-breaking (bare hands)"],w:"Ideological rigidity drove the entire first conflict."},
  {n:"Hyoga",i:"HY",bg:"#AFA9EC",fg:"#3C3489",g:"Former Enemies",j:"Chapter 145",st:"Provisional",r:"Spear Master & Tactical Combatant",arch:"The Cold Blade",q:["\"Emotions are inefficiencies.\"","\"Proper.\""],ov:"Hyoga is the most technically skilled combatant in the series. Where Tsukasa wins through overwhelming physical superiority, Hyoga wins through perfect technique — his spear work is described as the pinnacle of human martial refinement. He remains morally ambiguous throughout.",per:"Cold, analytical, and almost entirely absent of emotional expression. He views most people as variables in a calculation.",cr:"The most technically refined fighter in the series. His kusarigama-style spear technique is essentially unbeatable in direct combat. Even Tsukasa struggled with him.",kc:["Provides combat assets that can neutralize threats Tsukasa cannot","Tactical analysis improves Kingdom military planning","Key combatant during the Petrification Kingdom arc"],s:{i:80,c:98,u:65,l:60,ch:30},sk:["Spear mastery","Kusarigama technique","Combat tactics","Strategic analysis","Composure","Cold-blooded efficiency"],w:"Morally unreliable — loyalty is conditional on his own calculation."},
  {n:"Homura Momiji",i:"HM",bg:"#F5C4B3",fg:"#712B13",g:"Former Enemies",j:"Chapter 145",st:"Active",r:"Agility Scout & Acrobat",arch:"The Devoted Shadow",q:["— (She follows where Hyoga goes)"],ov:"Homura is Hyoga's devoted subordinate and the series' most mobile character. Her movement style is essentially parkour at an elite level — she can traverse any terrain at speed, scale structures instantly, and disappear into environments.",per:"Quiet, intense, and entirely focused on Hyoga. Independently capable but chooses her allegiance based on where he is.",cr:"Not a power fighter. Value is speed, agility, and stealth. Can outrun almost anyone and create chaos through mobility.",kc:["Serves as the Kingdom's fastest mobile scout","Terrain traversal enables recon in areas others cannot reach","Sabotage and distraction capability"],s:{i:50,c:60,u:72,l:15,ch:40},sk:["Parkour & acrobatics","Speed","Stealth","Terrain traversal","Infiltration","Agility"],w:"Not effective in direct confrontation. Loyalty contingent on Hyoga's direction."},
  // PETRIFICATION KINGDOM
  {n:"Kirisame",i:"KR",bg:"#9FE1CB",fg:"#085041",g:"Petrification Kingdom",j:"Chapter 180",st:"Active",r:"Elite Ranged Warrior & Medusa Device Wielder",arch:"The Honorable Guardian",q:["\"I fight for those I protect — nothing more.\""],ov:"Kirisame is one of the Petrification Kingdom's most formidable warriors and the individual entrusted with wielding the Medusa petrification device in combat. She uses a sling with extraordinary precision — capable of launching the Medusa itself as a projectile weapon, triggering mass petrification events over wide areas with pinpoint timing control. Upon learning of Ibara's deception, she immediately defected and sided with the Kingdom.",per:"Stoic, duty-bound, and deeply honorable. Operates from a strong internal code: she fights for those she is sworn to protect. When Ibara's deception was exposed, she acknowledged the truth and acted on it immediately without rationalization.",cr:"An elite ranged combatant. Her sling technique generates projectile velocities and precision that border on the supernatural. As carrier of the Medusa device she can trigger wide-area petrification offensively. Also a capable close-range fighter.",kc:["Wielded the Medusa petrification device as a battlefield weapon","Launched the Medusa at precise targets across large distances","Immediately defected upon Ibara's betrayal being revealed","Her defection stripped Ibara of his most powerful combat asset","Provided intelligence on Petrification Kingdom operations after defecting"],s:{i:58,c:88,u:80,l:52,ch:55},sk:["Sling mastery","Extreme ranged precision","Medusa device operation","Wide-area petrification deployment","Close combat","Physical conditioning","Tactical discipline","Honor-bound reliability"],w:"Unwavering loyalty to authority figures was weaponized against her by Ibara. Operates best with a clear moral framework."},
  {n:"Soyuz",i:"SO",bg:"#9FE1CB",fg:"#085041",g:"Petrification Kingdom",j:"Chapter 160",st:"Active",r:"Island Guide & Cultural Liaison",arch:"The Local Expert",q:["— (A man seeking to reclaim his home)"],ov:"Soyuz is a native of the island near the Petrification Kingdom living in exile. He provides irreplaceable local knowledge — terrain, customs, internal politics, and the layout of the Petrification Kingdom. He is the rightful heir to the island's leadership.",per:"Reserved and purposeful. He has been carrying the weight of his people's occupation for a long time and simply wants his home back.",cr:"Capable fighter. Joins combat operations during the Petrification Kingdom arc.",kc:["Provided tactical and geographic intelligence on the Petrification Kingdom","Served as cultural translator","Combat operative during island liberation","Rightful claim to leadership legitimized the Kingdom's actions"],s:{i:50,c:65,u:70,l:50,ch:52},sk:["Local geography","Cultural knowledge","Political intelligence","Combat","Leadership (hereditary)"],w:"Knowledge is geographically limited."},
  {n:"Amaryllis",i:"AM",bg:"#F4C0D1",fg:"#72243E",g:"Petrification Kingdom",j:"Chapter 162",st:"Active",r:"Infiltration Specialist & Covert Operative",arch:"The Vengeful Beauty",q:["\"I've been training for this infiltration my whole life.\""],ov:"Amaryllis spent years preparing to infiltrate the Petrification Kingdom's harem to find the petrification device and avenge her village. She trained specifically in beauty, performance, and social manipulation as weapons.",per:"Bold, confident, and driven by deep personal anger channeled into precise, patient action. Vain — she knows exactly how attractive she is and weaponizes it without apology.",cr:"Non-combatant in conventional terms. Her combat is social: seduction, deception, and manipulation.",kc:["Infiltrated the Petrification Kingdom's inner circle","Located and gathered intelligence on the petrification device","Orchestrated cover stories protecting the Kingdom's infiltration team","Disguised and guided Kohaku, Suika, and Ginro into enemy territory"],s:{i:70,c:15,u:82,l:40,ch:92},sk:["Seduction","Social infiltration","Disguise","Manipulation","Bravery","Planning","Makeup & appearance craft"],w:"Physically limited in direct confrontation."},
  {n:"Matsukaze",i:"MZ",bg:"#D3D1C7",fg:"#444441",g:"Petrification Kingdom",j:"Chapter 175",st:"Active",r:"Samurai Warrior & Devoted Protector",arch:"The Ancient Guardian",q:["\"My blade and my life belong to my lord.\"","\"My Lord!\""],ov:"Matsukaze is an ancient samurai petrified over a century ago. Upon revival, he finds a completely alien world yet adapts with remarkable composure. He bonds deeply with Ginro and serves as one of the Kingdom's most skilled melee fighters.",per:"Formal, serious, and deeply honorable. Operates by a centuries-old code applied earnestly to a modern situation. His interactions with Ginro are the series' funniest odd-couple dynamic.",cr:"Elite sword fighter. His swordsmanship reflects a lifetime of serious martial training.",kc:["Elite melee combat operative across the Petrification Kingdom arc","Provides samurai-level sword fighting capability","Emotional anchor for Ginro"],s:{i:50,c:85,u:60,l:45,ch:58},sk:["Sword mastery","Bushido discipline","Absolute loyalty","Physical strength","Combat endurance","Tactical awareness"],w:"The modern world is alien to him. Occasionally too rigid in applying ancient codes."},
  {n:"Moz",i:"MO",bg:"#F0997B",fg:"#712B13",g:"Petrification Kingdom",j:"Chapter 200",st:"Provisional",r:"Elite Combatant & Power Asset",arch:"The Mercenary Titan",q:["\"I fight for whoever gives me the best deal.\""],ov:"Moz is one of the Petrification Kingdom's top warriors and one of the physically most imposing characters in the entire series. His fighting ability is genuinely frightening — operating at a level that even Tsukasa would need to take seriously.",per:"Confident, hedonistic, and openly mercenary. Respects strength above everything. This honesty makes him, paradoxically, somewhat reliable within defined terms.",cr:"One of the Kingdom's most powerful combat assets. Physical strength and fighting skill rival the strongest members. Specializes in spear combat.",kc:["Key combat operative during liberation of the Petrification Kingdom","Neutralized threats other Kingdom fighters would have struggled with","His defection shifted combat balance significantly"],s:{i:45,c:95,u:55,l:35,ch:50},sk:["Elite combat","Spear fighting","Superhuman strength","Speed","Intimidation","Tactical cunning"],w:"Morally unreliable — loyalty is entirely transactional."},
  // AMERICAN COALITION
  {n:"Xeno Houston Wingfield",i:"XH",bg:"#B5D4F4",fg:"#0C447C",g:"American Coalition",j:"Chapter 215",st:"Provisional",r:"Rival Scientist & Science Commander",arch:"The Mirror Genius",q:["\"Science is power — and power belongs to those who wield it wisely.\"","\"Either he's honest to a fault, or the world's greatest liar.\""],ov:"Xeno is Senku's closest intellectual equal in the series. A scientist and former professor who built his own advanced colony in North America, paralleling Senku's Kingdom but with a fundamentally different ideology: where Senku democratizes science, Xeno believes it should serve a select elite.",per:"Aristocratic, precise, and ideologically committed. Not a villain in the simple sense — he genuinely believes in his vision. He respects Senku enormously.",cr:"Non-combatant. Value is entirely scientific and strategic.",kc:["Independently developed petroleum, plastics, and other advanced technologies","His knowledge fills genuine gaps in Senku's expertise","Provides American colony knowledge and resources"],s:{i:97,c:10,u:90,l:85,ch:75},sk:["Chemistry","Physics","Engineering","Scientific strategy","Petroleum science","Leadership","Institutional organization"],w:"Ideological rigidity. His elitism is a philosophical liability in the Kingdom's model."},
  {n:"Stanley Snyder",i:"SS",bg:"#D3D1C7",fg:"#444441",g:"American Coalition",j:"Chapter 220",st:"Active",r:"Elite Sniper & Military Commander",arch:"The Perfect Soldier",q:["\"I follow orders. That's all.\""],ov:"Stanley is the most dangerous conventional soldier in the entire series. A former Special Forces sniper and Xeno's personal bodyguard — disciplined, devastatingly capable, and utterly loyal to Xeno. His marksmanship borders on supernatural.",per:"Clipped, efficient, and almost entirely mission-focused. Speaks rarely and acts immediately. Loyalty to Xeno is absolute and defines his entire moral framework.",cr:"The most dangerous ranged combatant in the series. Sniping can neutralize threats no other Kingdom member can address at range. In CQB also elite.",kc:["Neutralized multiple high-value threats from extreme range","Provided elite military command during the final arc","His shift to the Kingdom's side ended the American conflict"],s:{i:70,c:99,u:72,l:80,ch:40},sk:["Sniping","Marksmanship","CQB combat","Military tactics","Leadership","Discipline","Operational planning"],w:"Loyalty is to Xeno, not the Kingdom per se."},
  {n:"Brody Dudley",i:"BD",bg:"#F0997B",fg:"#712B13",g:"American Coalition",j:"Chapter 157",st:"Active",r:"Doctorate Engineer, Heavy Machinery & Diplomat",arch:"The Conscience of the Colony",q:["\"There isn't a single person on this planet who deserves to die!\""],ov:"Dr. Brody Dudley holds a doctorate in mechanical engineering and is the American Colony's primary builder of large-scale machinery. Hired by the military specifically for his engineering expertise, he is capable of constructing submarines, aircraft, factories, tractors, and weapons entirely from scratch. He is the American Colony's answer to Kaseki — but operating at an industrial, heavy-machinery scale. Critically, Brody also carries the colony's moral conscience and his diplomatic instincts were the key to preventing all-out war between the Kingdom of Science and the American Colony.",per:"Bold, direct, and larger than life in personality — but beneath the physicality is a man who genuinely believes no one deserves to die. When a tunnel collapse trapped Kingdom members, he immediately halted his own soldiers from rushing them, prioritizing saving lives over military advantage. He led the American Colony in Xeno and Stanley's absence and chose negotiation over conflict.",cr:"Capable in combat due to military background and exceptional physical strength — shown carrying boulders during construction. However combat is not his primary value. He is most dangerous as an engineer who can produce weapons, submarines, and aircraft for whichever side he's on.",kc:["Holds a doctorate — properly addressed as Dr. Brody in his debut","Built the American Colony's submarine alongside Xeno that attacked the Perseus","Constructed aircraft, factories, tractors, guns, and weapons from scratch","Led the American Colony as de facto commander in Xeno and Stanley's absence","Halted soldiers from endangering trapped Kingdom members — prioritizing lives over military advantage","Negotiated the truce with Senku's side and established Corn City"],s:{i:72,c:65,u:91,l:72,ch:70},sk:["Heavy machinery engineering","Submarine construction","Aircraft & vehicle fabrication","Weapons manufacturing","Factory construction","Military mechanics","Diplomacy & negotiation","Leadership under pressure","Mental resilience","Immense physical strength","Moral conviction"],w:"His pacifist instincts can create tension with the military wing. Engineering requires resources and time — cannot improvise in the field like Chrome or Senku."},
  {n:"Joel Gear",i:"JG",bg:"#FAC775",fg:"#633806",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Master Watchmaker & Precision Mechanic",arch:"The Tiny Titan of Craft",q:["\"Every gear must be perfect. Every tooth must be perfect. Everything must be perfect.\""],ov:"Joel is a watchmaker of extraordinary skill who serves as Xeno's equivalent of Kaseki for small-scale precision work. Where Kaseki works at a large industrial scale, Joel operates at a level of miniaturization and mechanical precision that is nearly unparalleled. His fingers are supernaturally deft, capable of fabricating the most intricate mechanical components imaginable.",per:"Obsessive and exacting. Joel cannot tolerate imprecision in any form — a single misaligned gear tooth is a personal affront. He is deeply passionate about his craft, and represents a fascinating parallel with Kaseki: both driven by an almost spiritual devotion to making beautiful, functional things.",cr:"Non-combatant. His hands are too valuable to risk in a fight.",kc:["Fabricated critical precision mechanical components for the American Colony","His clock mechanisms enabled precise timekeeping essential to navigation","Produced intricate components that no one else in either colony could replicate","His craftsmanship complemented Kaseki's, filling miniaturization gaps","Essential to precision instruments for the rocket project"],s:{i:72,c:5,u:90,l:20,ch:40},sk:["Watchmaking","Precision mechanics","Miniaturized fabrication","Gear and clockwork construction","Fine mechanical engineering","Dexterity","Quality obsession"],w:"Non-combatant. Contribution almost entirely limited to precision mechanical fabrication. Perfectionism can slow production."},
  {n:"Maya Biggs",i:"MY",bg:"#9FE1CB",fg:"#085041",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Elite Combat Soldier & MMA Champion",arch:"The Disciplined Warrior",q:["— (Actions define her)"],ov:"Maya is the reigning American Women's MMA champion turned soldier in Xeno's American Colony — a disciplined and highly capable fighter who is significantly more skilled than a typical foot soldier. She brings professional combat training and championship-level fighting ability to the Kingdom coalition.",per:"Disciplined, focused, and mission-oriented. Defined by professionalism; follows the chain of command, which transitioned smoothly to the Kingdom coalition structure.",cr:"Elite infantry and close-quarters fighter. Her MMA championship credentials make her one of the more dangerous unarmed combatants in the series.",kc:["Served as elite combat operative during the American arc","Championship-level combat training elevated the Kingdom's overall coordination","Reliable armed operative for the Kingdom coalition"],s:{i:52,c:84,u:55,l:45,ch:50},sk:["MMA championship combat","Close-quarters fighting","Discipline","Teamwork","Physical conditioning","Firearms","Tactical awareness"],w:"Limited contribution outside of direct combat contexts."},
  {n:"Charlotte",i:"CT",bg:"#F4C0D1",fg:"#72243E",g:"American Coalition",j:"Chapter 215",st:"Active",r:"American Colony Support Member",arch:"The Ensemble Player",q:["— (Part of the coalition crew)"],ov:"Charlotte is a member of Xeno's American Colony who becomes part of the extended Kingdom coalition. She contributes to the crew's overall function and has a genuine investment in the mission's success following the resolution of the American arc conflict.",per:"Adaptable and crew-focused. Integrates into the Kingdom's way of doing things without major friction.",cr:"General support. Not a frontline combatant.",kc:["Colony support duties during the American arc and beyond","Crew function aboard vessels and during expeditions","Provided insider knowledge of the American Colony's operations"],s:{i:45,c:42,u:52,l:25,ch:48},sk:["General support","Colony knowledge","Adaptability","Crew cohesion","Team reliability"],w:"Limited individual specialization or standout abilities."},
  {n:"Leonard Maxwell",i:"LM",bg:"#CECBF6",fg:"#3C3489",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Radar Expert & Pilot",arch:"The Quiet Contributor",q:["— (Works best behind the scenes)"],ov:"Leonard Maxwell is the American Colony's expert radar operator and pilot. His radar expertise gave the colony an advanced detection capability, and his piloting skills make him one of the few people able to fly the aircraft that Brody and Xeno constructed.",per:"Reserved and practical. Doesn't seek attention or leadership — contributes where placed and does his job. Adapted to the Kingdom coalition's culture with quiet efficiency.",cr:"Support and aerial role. Piloting capability makes him valuable in reconnaissance and transport missions.",kc:["Expert radar operation provided advanced detection capabilities","Piloting skills enabled use of aircraft constructed by Brody and Xeno","Assisted with reconnaissance and aerial operations during coalition missions"],s:{i:62,c:45,u:68,l:28,ch:38},sk:["Radar operation","Piloting","Aerial reconnaissance","Technical electronics","Detection systems","Reliability","Adaptability"],w:"Highly specialized — limited value outside of radar and aviation contexts."},
  {n:"Luna Wright",i:"LW",bg:"#F4C0D1",fg:"#72243E",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Medical Professional & Infiltration Asset",arch:"The Reluctant Operative",q:["\"This is not what I signed up for.\""],ov:"Luna is a medical professional from Xeno's American Colony who ended up pretending to be Senku's girlfriend as part of a Kingdom intelligence operation. Good-natured, slightly overwhelmed by the insanity around her, and genuinely skilled in medicine.",per:"Normal, warm, and frequently exasperated. One of the most grounded characters in the later arcs — a regular person caught up in extraordinary events.",cr:"Non-combatant. Medical support only.",kc:["Medical support during and after the American arc","Intelligence gathering during the Senku-girlfriend operation","Provided knowledge of Xeno's colony structure and resources"],s:{i:65,c:10,u:65,l:25,ch:65},sk:["Medicine","Medical care","Infiltration (social)","Emotional grounding","Knowledge of American colony"],w:"Non-combatant. Limited outside medical contexts."},
  {n:"Max & Carlos",i:"MC",bg:"#C0DD97",fg:"#3B6D11",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Support Members",arch:"Ensemble Support",q:["— (Reliable crew members)"],ov:"Max and Carlos are American Colony members who become part of the extended Kingdom coalition. Both are reliable additions to the crew during the later phases of the mission.",per:"Earnest and crew-minded. They integrate into the Kingdom's culture without drama.",cr:"General combat support.",kc:["Crew duties aboard the Perseus and later vessels","General labor and support across late-arc missions"],s:{i:40,c:55,u:50,l:20,ch:45},sk:["General combat","Manual labor","Crew cohesion","Adaptability"],w:"Limited individual specialization."},
  // ISS CREW
  {n:"Byakuya Ishigami",i:"BI",bg:"#CECBF6",fg:"#3C3489",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased",r:"Founder of Ishigami Village & Architect of the Future",arch:"The Loving Father",q:["\"I'm cheering for you, Senku.\"","\"If you're serious, you can accomplish anything through diligent application of science.\"","\"I'll bring you back home a mountain of scientific souvenirs from space!\""],ov:"Byakuya Ishigami is the unsung hero of Dr. Stone. An astronaut aboard the ISS when the petrification event struck Earth, he and his small crew were spared. He watched from orbit as humanity was turned to stone, then made a decision: return to Earth, live a human life, found a village, and leave behind everything Senku would need to find. He encoded all of humanity's critical knowledge into the 100 Tales and raised a generation of people who would pass them down faithfully. He never met Senku again. He just trusted him.",per:"Warm, cheerful, and deeply devoted to Senku despite not being his biological father. His faith in Senku, expressed across millennia, is what made the Kingdom of Science possible. His final message to Senku encoded in the 100 Tales is one of the most emotional moments in the series.",cr:"Non-combatant. His contributions were made entirely before the story begins.",kc:["Founded Ishigami Village as a civilization seed for Senku to find","Encoded the 100 Tales with medicine, chemistry, physics, and critical knowledge","Ensured the survival of a lineage that would reach Senku across 3,700 years","Returned safely from the ISS despite all odds and lived a full human life for Senku's sake","His love for Senku is the emotional engine of the entire story"],s:{i:78,c:20,u:100,l:80,ch:90},sk:["Astronautics","Foresight","Encoded knowledge transmission","Parenting","Leadership","Long-term planning","Music (emotional legacy)"],w:"Deceased. All contributions were made before the story's timeline."},
  {n:"Lillian Weinberg",i:"LI",bg:"#F4C0D1",fg:"#72243E",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"Pop Star, Morale Officer & Cultural Legacy",arch:"The Voice That Echoed 3,700 Years",q:["\"Space is beautiful, but so is every person on Earth.\""],ov:"Lillian Weinberg was a world-famous pop star aboard the ISS as a civilian passenger when the petrification event struck. As the only non-scientist in the crew, her role was immediately clear: she was the heart. Her music and spirit kept the group together during the return to a petrified Earth. Her songs passed down through generations — unknowingly becoming a pivotal piece of intelligence 3,700 years later when Gen used her voice to authenticate the Lillian impersonation to Nikki.",per:"Vibrant, compassionate, and deeply human. Lillian understood that in the face of apocalyptic hopelessness, joy and beauty were not luxuries — they were survival tools. Her warmth and music were the glue that held the founding generation together.",cr:"Non-combatant. Her contribution was entirely emotional and cultural.",kc:["Kept the ISS crew's morale intact during the return to a petrified Earth","Her music and spirit were encoded in Ishigami Village's cultural traditions across 3,700 years","Her distinctive voice became the linchpin of Gen's Tsukasa deception","Her songs were the emotional foundation of Ishigami Village's culture","Represents the argument that culture and art are as essential to civilization as science"],s:{i:48,c:5,u:75,l:40,ch:100},sk:["Singing","Performance","Emotional leadership","Morale","Cultural transmission","Empathy","Inspiration"],w:"No scientific or combat contribution. Her impact was entirely cultural and posthumous."},
  {n:"Connie Lee",i:"CL",bg:"#C0DD97",fg:"#3B6D11",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Crew Member & Village Co-Founder",arch:"The Steadfast Crewmate",q:["— (One of the five who chose to return)"],ov:"Connie Lee was a member of the ISS crew who survived the petrification event. When the crew voted to return to Earth rather than stay safely in orbit, Connie was among those who chose to go back. She lived out her life as one of the founding members of Ishigami Village, contributing to the construction of a community that would last 3,700 years.",per:"Resolute and committed. The act of choosing to return to a petrified Earth when you could have stayed in orbit says everything about who Connie was. Grounded, practical, and deeply invested in the survival of her crewmates and the future of humanity.",cr:"Non-combatant.",kc:["Returned to Earth with Byakuya and helped establish the founding community","Contributed to the early years of what became Ishigami Village","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:62,c:20,u:65,l:45,ch:55},sk:["Astronautics","Crisis resilience","Community building","Practical problem-solving","Teamwork","Commitment"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  {n:"Darya Nikitina",i:"DN",bg:"#CECBF6",fg:"#3C3489",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Cosmonaut & Village Co-Founder",arch:"The Iron Cosmonaut",q:["— (Strength of will, strength of hands)"],ov:"Darya Nikitina was a Russian cosmonaut aboard the ISS who survived the petrification event. Highly trained in space station systems, engineering, and survival procedures, she was one of the crew's most technically capable members. Her engineering background contributed to the founding generation's ability to establish a sustainable community upon returning to Earth.",per:"Stoic, capable, and deeply pragmatic. Darya was the kind of person who assesses a crisis, identifies what needs to be done, and does it without complaint.",cr:"Non-combatant.",kc:["Technical and engineering contributions to the early Ishigami Village founding","ISS systems expertise assisted with descent and Earth re-entry planning","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:70,c:25,u:72,l:52,ch:48},sk:["Aerospace engineering","ISS systems","Survival skills","Technical problem-solving","Physical conditioning","Crisis management"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  {n:"Shamil Volkov",i:"SV",bg:"#D3D1C7",fg:"#444441",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Cosmonaut & Village Co-Founder",arch:"The Reliable One",q:["— (Steady hands when it mattered most)"],ov:"Shamil Volkov was a Russian cosmonaut aboard the ISS who survived the petrification event. Together with Darya Nikitina, he represented the Russian cosmonaut contingent of the crew. His training in spacecraft systems, physical conditioning, and survival procedures made him an invaluable member of the founding generation.",per:"Warm, steady, and deeply reliable. Shamil was the kind of crew member everyone wanted in an emergency — calm, experienced, and capable. A stabilizing presence during the terrifying weeks following the petrification event.",cr:"Non-combatant.",kc:["Physical labor and practical skills during the founding of Ishigami Village","Spacecraft and survival systems knowledge assisted early Earth re-adaptation","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:65,c:30,u:68,l:48,ch:60},sk:["Aerospace systems","Physical conditioning","Survival skills","Teamwork","Emotional steadiness","Reliability"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  // HISTORICAL / SYMBOLIC
  {n:"Mirai Shishio",i:"MI",bg:"#9FE1CB",fg:"#085041",g:"Historical / Symbolic",j:"Chapter 130",st:"Active",r:"Tsukasa's Sister & Symbolic Motivation",arch:"The Reason Everything Happened",q:["— (Her existence changed the entire story)"],ov:"Mirai is Tsukasa's terminally ill younger sister. Tsukasa's entire ideology — his war against adults, his willingness to kill, his conflict with Senku — was rooted in the desire to revive her in a safe world. When the Kingdom's medicine finally heals her, it is the pivotal event that transforms Tsukasa from enemy to ally.",per:"Gentle, sweet, and almost entirely free of the darkness that defined her brother's path. She understands what Tsukasa did for her — and she grieves it.",cr:"Non-combatant. No combat role.",kc:["Her existence was the root cause of the Kingdom's first war","Her recovery through Kingdom medicine was the inflection point of Tsukasa's redemption","Proved the Kingdom's medical capabilities dramatically"],s:{i:40,c:5,u:30,l:10,ch:70},sk:["Emotional significance","Tsukasa's anchor","Symbol of peaceful future","Gentleness"],w:"No combat or scientific role. Value is entirely emotional and narrative."},
];

const GROUPS=["All",...new Set(M.map(m=>m.g))];
let activeGroup="All",query="",mode="grid",sortStat="overall";

function overall(m){const s=m.s;return Math.round((s.i+s.c+s.u+s.l+s.ch)/5);}
function getVal(m,stat){const map={intelligence:"i",combat:"c",utility:"u",leadership:"l",charisma:"ch"};return stat==="overall"?overall(m):m.s[map[stat]];}

function initFilters(){
  const fr=document.getElementById("filters");
  GROUPS.forEach(g=>{
    const p=document.createElement("button");
    p.className="pill"+(g==="All"?" active":"");
    p.textContent=g;
    p.onclick=()=>{activeGroup=g;document.querySelectorAll(".pill").forEach(e=>e.classList.remove("active"));p.classList.add("active");render();};
    fr.appendChild(p);
  });
}

function setMode(m){
  mode=m;
  document.getElementById("btn-grid").classList.toggle("active",m==="grid");
  document.getElementById("btn-rank").classList.toggle("active",m==="rank");
  document.getElementById("sort-wrap").style.display=m==="rank"?"block":"none";
  render();
}

const sortClsMap={overall:"overall",intelligence:"intel",combat:"combat",utility:"utility",leadership:"lead",charisma:"charisma"};
function setSort(s){
  sortStat=s;
  document.querySelectorAll("[id^='sort-']").forEach(b=>{
    b.classList.remove("active","overall","intel","combat","utility","lead","charisma");
  });
  const btn=document.getElementById("sort-"+s);
  if(btn) btn.classList.add("active",sortClsMap[s]);
  render();
}

function getFiltered(){
  query=document.getElementById("search").value.toLowerCase();
  return M.filter(m=>{
    const mg=activeGroup==="All"||m.g===activeGroup;
    const ms=!query||m.n.toLowerCase().includes(query)||m.r.toLowerCase().includes(query)||m.sk.some(s=>s.toLowerCase().includes(query))||m.g.toLowerCase().includes(query);
    return mg&&ms;
  });
}

function render(){
  const f=getFiltered();
  document.getElementById("count").textContent=f.length+" member"+(f.length!==1?"s":"")+" shown";
  const el=document.getElementById("content");
  if(!f.length){el.innerHTML='<div class="empty">No members found.</div>';return;}

  if(mode==="grid"){
    el.innerHTML=`<div class="grid">${f.map(m=>`
      <div class="card" onclick="showDetail(${M.indexOf(m)})">
        <div class="card-top">
          <div class="av" style="background:${m.bg};color:${m.fg}">${m.i}</div>
          <div><div class="card-name">${m.n}</div><div class="card-role">${m.r}</div></div>
        </div>
        <div>${m.sk.slice(0,3).map(s=>`<span class="badge">${s}</span>`).join("")}${m.sk.length>3?`<span class="badge">+${m.sk.length-3}</span>`:""}</div>
      </div>`).join("")}</div>`;
  } else {
    const sorted=[...f].sort((a,b)=>getVal(b,sortStat)-getVal(a,sortStat));
    const color=SC[sortStat];
    const label=sortStat==="overall"?"Overall":sortStat.charAt(0).toUpperCase()+sortStat.slice(1);
    el.innerHTML=`<div class="rank-list">${sorted.map((m,i)=>{
      const val=getVal(m,sortStat);
      const nc=i===0?"rnum gold":i===1?"rnum silver":i===2?"rnum bronze":"rnum";
      const med=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
      return`<div class="rank-row" onclick="showDetail(${M.indexOf(m)})">
        <div class="${nc}">${med||"#"+(i+1)}</div>
        <div class="rav" style="background:${m.bg};color:${m.fg}">${m.i}</div>
        <div class="rinfo"><div class="rname">${m.n}</div><div class="rrole">${m.r}</div></div>
        <div class="rright">
          <div class="rscore" style="color:${color}">${val}</div>
          <div class="rbarbg"><div class="rbar" style="width:${val}%;background:${color}"></div></div>
          <div class="rlabel">${label}</div>
        </div>
      </div>`;
    }).join("")}</div>`;
  }
}

function sB(label,val,key,highlight){
  const c=highlight?(SC[key]||barC(val)):barC(val);
  const bdr=highlight?`border-color:${c};`:"";
  return`<div class="sbox" style="${bdr}">
    <div class="slbl">${label}</div>
    <div class="sval" style="color:${c}">${val}/100</div>
    <div class="bbg"><div class="bfill" style="width:${val}%;background:${c}"></div></div>
  </div>`;
}

function showDetail(idx){
  const m=M[idx];const s=m.s;const ov=overall(m);
  document.getElementById("panel").innerHTML=`
    <div class="ph">
      <div class="lgav" style="background:${m.bg};color:${m.fg}">${m.i}</div>
      <div><div class="pname">${m.n}</div><div class="pmeta">${m.arch} · ${m.g} · Joined: ${m.j} · Status: ${m.st}</div></div>
    </div>
    <div class="sec">Overview</div><p class="desc">${m.ov}</p>
    <div class="sec">Personality</div><p class="desc">${m.per}</p>
    <div class="sec">Combat role</div><p class="desc">${m.cr}</p>
    <div class="sec">Signature quote${m.q.length>1?"s":""}</div>${m.q.map(q=>`<div class="quote">${q}</div>`).join("")}
    <div class="sec">Stat ratings — Overall: ${ov}/100</div>
    <div class="sgrid">
      ${sB("Intelligence",s.i,"intelligence",sortStat==="intelligence")}
      ${sB("Combat",s.c,"combat",sortStat==="combat")}
      ${sB("Utility",s.u,"utility",sortStat==="utility")}
      ${sB("Leadership",s.l,"leadership",sortStat==="leadership")}
      ${sB("Charisma",s.ch,"charisma",sortStat==="charisma")}
    </div>
    <div class="sec">Key contributions</div>
    ${m.kc.map(k=>`<div class="km">· ${k}</div>`).join("")}
    <div class="sec">Strengths & skills</div>
    <div>${m.sk.map(s=>`<span class="chip">${s}</span>`).join("")}</div>
    <div class="sec">Notable weakness</div><p class="desc">${m.w}</p>
    <button class="closebtn" onclick="closePanel()">Close</button>`;
  document.getElementById("overlay").classList.add("open");
}

function maybeClose(e){
  if(e.target===document.getElementById("overlay")) closePanel();
}
function closePanel(){
  document.getElementById("overlay").classList.remove("open");
}

initFilters();
setSort("overall");
render();
</script>
</body>
</html>
