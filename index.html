osis. Articulate and pedantic, quick-witted enough to verbally fence with Senku in real time.",cr:"Non-combatant. No martial training, no field weapons skill of his own. His sole 'combat' contribution is engineering Stanley's customized 'X pistol' sidearm and outfitting the colony's military. Survives every engagement by being adjacent to Stanley — when Chrome captures him during the American Saga, Xeno has no recourse and becomes a hostage that flips the situation.",kc:["Senku's earliest scientific mentor — replied to a child's unsolicited rocket-theory email when no other NASA scientist would","Founded the American Colony / Corn City — industrialized petroleum, plastics, mass-produced firearms and ammunition, a tech tier ahead of the Kingdom at first contact","Captured Senku via Stanley's sniping and the petrification device — preserved him for revival on Xeno's own terms","Captured by Chrome during a cave-in; offered Chrome co-rulership of the Stone World as his commander, and was refused","Co-designed the Moon Mission rocket engine with Senku — the 'after ten years, we finally get to work together' moment","Confirmed the lunar black mass is unnatural and located Why-man, making the entire moonshot targetable"],s:{i:98,c:10,u:94,l:82,ch:78},sk:["Chemistry","Petroleum science","Rocket propulsion","Weapons engineering","Strategic planning","Institutional leadership","Mathematics","Plastics & polymers"],w:"Ideological rigidity — scientific elitism blinds him to the cooperative model Senku proves works better. Total combat dependence on Stanley: remove Stanley and Xeno is a hostage waiting to happen (literally what Chrome demonstrated). Ego and theatricality — monologues and explains, giving opponents thinking time. Sentimental blind spot for Senku — repeatedly hesitates to fully destroy his protégé, costing him strategic finality."},
  {n:"Stanley Snyder",i:"SS",bg:"#D3D1C7",fg:"#444441",g:"American Coalition",j:"Chapter 220",st:"Active",r:"Elite Sniper & Military Commander",arch:"The Perfect Soldier",q:["\"I follow orders. That's all.\"","\"Orders from Xeno. Nothing else matters.\""],ov:"Former US Special Forces operator and elite military sniper-pilot — childhood friend of Xeno Houston Wingfield, not just his bodyguard but his lifelong partner. Pre-Stone-World the two were already operating together; they shared 'shady deals' to fund Xeno's research. Endured 3,700+ years of petrification by maintaining consciousness using his sniper-trained mental discipline — he assumed his sniper patience would let him stay awake, and it did. Revived by Xeno in the American Colony as Commander & Sniper, he is the most dangerous conventional combatant in the series when armed: the only character the in-universe strongest fighter (Tsukasa) is openly wary of facing.",per:"Clipped, laconic, mission-focused. Acts the instant orders are given; rarely speaks unless tactically necessary. Operates by a strict professional code — avoids unnecessary killing, can acknowledge defeat when strategy demands. Loyalty to Xeno is the entire load-bearing pillar of his morality; he pauses once to ask Xeno to confirm the kill order on Senku before executing — loyalty is not blind but it is final. First named character in the series shown smoking; cool-headed, almost relaxed even under fire.",cr:"The most dangerous conventional combatant in the series when armed. Cheat-level marksmanship and superhuman patience. Calculated wind/velocity/range from the stripes on Luna's outfit; tracked the Perseus's destination by lip-reading Xeno across distance; predicted Senku's evasion arc *after* he ducked the first shot. Carries machine gun, sidearm pistol, and dagger; elite in close-quarters with top-tier physical strength. Kohaku, Ukyo, and Max are the only Kingdom combatants explicitly able to operate against his unit at all. Tsukasa wins pure hand-to-hand; Stanley wins anywhere a firearm exists.",kc:["Sniped Senku at long range during the New America City Arc — Senku survived only via a hastily-improvised bulletproof vest","Fired the Petrification Device itself as a bullet to stop the escaping Perseus crew — triggering the second worldwide petrification event","Led the American Colony's military arm and Xeno's elite protection unit","Tracked the Perseus's destination by lip-reading Xeno across distance — long-range intel feat","Flipped to Kingdom-aligned after the Gen/Ukyo/Ryusui team negotiated Xeno's cooperation — Stanley follows Xeno's allegiance absolutely","Replaced Ryusui on the Moon Mission astronaut crew — Ryusui voluntarily stepped down recognizing Stanley's superior pilot and combat credentials; final crew is Senku, Kohaku, Stanley"],s:{i:72,c:99,u:78,l:82,ch:40},sk:["Precision sniping","Marksmanship","CQB specialist","Military tactics","Squad leadership","Combat discipline","Operational planning","Combat piloting"],w:"Loyalty is to Xeno personally, not to the Kingdom of Science as an institution — his allegiance flipped only because Xeno's did, and would reverse if Xeno's did. Heavily firearm-dependent: strip his rifle and he loses the gap against Tsukasa-tier melee fighters. Not a scientist — cannot independently advance the Kingdom's tech goals; he is a force multiplier, not a creator. Single-point-of-failure psychology — Xeno's capture (American Saga) is the only lever that reliably stops him."},
  {n:"Brody Dudley",i:"BD",bg:"#F0997B",fg:"#712B13",g:"American Coalition",j:"Chapter 157",st:"Active",r:"Doctorate Engineer, Heavy Machinery & Diplomat",arch:"The Conscience of the Colony",q:["\"There isn't a single person on this planet who deserves to die!\""],ov:"Dr. Brody Dudley holds a doctorate in mechanical engineering and is the American Colony's primary builder of large-scale machinery. Hired by the military specifically for his engineering expertise, he is capable of constructing submarines, aircraft, factories, tractors, and weapons entirely from scratch. He is the American Colony's answer to Kaseki — but operating at an industrial, heavy-machinery scale. Critically, Brody also carries the colony's moral conscience and his diplomatic instincts were the key to preventing all-out war between the Kingdom of Science and the American Colony.",per:"Bold, direct, and larger than life in personality — but beneath the physicality is a man who genuinely believes no one deserves to die. When a tunnel collapse trapped Kingdom members, he immediately halted his own soldiers from rushing them, prioritizing saving lives over military advantage. He led the American Colony in Xeno and Stanley's absence and chose negotiation over conflict.",cr:"Capable in combat due to military background and exceptional physical strength — shown carrying boulders during construction. However combat is not his primary value. He is most dangerous as an engineer who can produce weapons, submarines, and aircraft for whichever side he's on.",kc:["Holds a doctorate — properly addressed as Dr. Brody in his debut","Built the American Colony's submarine alongside Xeno that attacked the Perseus","Constructed aircraft, factories, tractors, guns, and weapons from scratch","Led the American Colony as de facto commander in Xeno and Stanley's absence","Halted soldiers from endangering trapped Kingdom members — prioritizing lives over military advantage","Negotiated the truce with Senku's side and established Corn City"],s:{i:72,c:65,u:91,l:72,ch:70},sk:["Heavy machinery engineering","Submarine construction","Aircraft & vehicle fabrication","Weapons manufacturing","Factory construction","Military mechanics","Diplomacy & negotiation","Leadership under pressure","Mental resilience","Immense physical strength","Moral conviction"],w:"His pacifist instincts can create tension with the military wing. Engineering requires resources and time — cannot improvise in the field like Chrome or Senku."},
  {n:"Joel Gear",i:"JG",bg:"#FAC775",fg:"#633806",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Master Watchmaker & Precision Mechanic",arch:"The Tiny Titan of Craft",q:["\"Every gear must be perfect. Every tooth must be perfect. Everything must be perfect.\""],ov:"Joel is a watchmaker of extraordinary skill who serves as Xeno's equivalent of Kaseki for small-scale precision work. Where Kaseki works at a large industrial scale, Joel operates at a level of miniaturization and mechanical precision that is nearly unparalleled. His fingers are supernaturally deft, capable of fabricating the most intricate mechanical components imaginable.",per:"Obsessive and exacting. Joel cannot tolerate imprecision in any form — a single misaligned gear tooth is a personal affront. He is deeply passionate about his craft, and represents a fascinating parallel with Kaseki: both driven by an almost spiritual devotion to making beautiful, functional things.",cr:"Non-combatant. His hands are too valuable to risk in a fight.",kc:["Fabricated critical precision mechanical components for the American Colony","His clock mechanisms enabled precise timekeeping essential to navigation","Produced intricate components that no one else in either colony could replicate","His craftsmanship complemented Kaseki's, filling miniaturization gaps","Essential to precision instruments for the rocket project"],s:{i:72,c:5,u:90,l:20,ch:40},sk:["Watchmaking","Precision mechanics","Miniaturized fabrication","Gear and clockwork construction","Fine mechanical engineering","Dexterity","Quality obsession"],w:"Non-combatant. Contribution almost entirely limited to precision mechanical fabrication. Perfectionism can slow production."},
  {n:"Maya Biggs",i:"MY",bg:"#9FE1CB",fg:"#085041",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Elite Combat Soldier & MMA Champion",arch:"The Disciplined Warrior",q:["— (Actions define her)"],ov:"Maya is the reigning American Women's MMA champion turned soldier in Xeno's American Colony — a disciplined and highly capable fighter who is significantly more skilled than a typical foot soldier. She brings professional combat training and championship-level fighting ability to the Kingdom coalition.",per:"Disciplined, focused, and mission-oriented. Defined by professionalism; follows the chain of command, which transitioned smoothly to the Kingdom coalition structure.",cr:"Elite infantry and close-quarters fighter. Her MMA championship credentials make her one of the more dangerous unarmed combatants in the series.",kc:["Served as elite combat operative during the American arc","Championship-level combat training elevated the Kingdom's overall coordination","Reliable armed operative for the Kingdom coalition"],s:{i:52,c:84,u:55,l:45,ch:50},sk:["MMA championship combat","Close-quarters fighting","Discipline","Teamwork","Physical conditioning","Firearms","Tactical awareness"],w:"Limited contribution outside of direct combat contexts."},
  {n:"Charlotte",i:"CT",bg:"#F4C0D1",fg:"#72243E",g:"American Coalition",j:"Chapter 215",st:"Active",r:"American Colony Support Member",arch:"The Ensemble Player",q:["— (Part of the coalition crew)"],ov:"Charlotte is a member of Xeno's American Colony who becomes part of the extended Kingdom coalition. She contributes to the crew's overall function and has a genuine investment in the mission's success following the resolution of the American arc conflict.",per:"Adaptable and crew-focused. Integrates into the Kingdom's way of doing things without major friction.",cr:"General support. Not a frontline combatant.",kc:["Colony support duties during the American arc and beyond","Crew function aboard vessels and during expeditions","Provided insider knowledge of the American Colony's operations"],s:{i:45,c:42,u:52,l:25,ch:48},sk:["General support","Colony knowledge","Adaptability","Crew cohesion","Team reliability"],w:"Limited individual specialization or standout abilities."},
  {n:"Leonard Maxwell",i:"LM",bg:"#CECBF6",fg:"#3C3489",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Radar Expert & Pilot",arch:"The Quiet Contributor",q:["— (Works best behind the scenes)"],ov:"Leonard Maxwell is the American Colony's expert radar operator and pilot. His radar expertise gave the colony an advanced detection capability, and his piloting skills make him one of the few people able to fly the aircraft that Brody and Xeno constructed.",per:"Reserved and practical. Doesn't seek attention or leadership — contributes where placed and does his job. Adapted to the Kingdom coalition's culture with quiet efficiency.",cr:"Support and aerial role. Piloting capability makes him valuable in reconnaissance and transport missions.",kc:["Expert radar operation provided advanced detection capabilities","Piloting skills enabled use of aircraft constructed by Brody and Xeno","Assisted with reconnaissance and aerial operations during coalition missions"],s:{i:62,c:45,u:68,l:28,ch:38},sk:["Radar operation","Piloting","Aerial reconnaissance","Technical electronics","Detection systems","Reliability","Adaptability"],w:"Highly specialized — limited value outside of radar and aviation contexts."},
  {n:"Luna Wright",i:"LW",bg:"#F4C0D1",fg:"#72243E",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Medical Professional & Infiltration Asset",arch:"The Reluctant Operative",q:["\"This is not what I signed up for.\"","\"I'm the cool-headed Luna! I'm the capable Luna!\""],ov:"Luna is a medical professional from Xeno's American Colony who ended up pretending to be Senku's girlfriend as part of a Kingdom intelligence operation. Good-natured, slightly overwhelmed by the insanity around her, and genuinely skilled in medicine.",per:"Normal, warm, and frequently exasperated. One of the most grounded characters in the later arcs — a regular person caught up in extraordinary events.",cr:"Non-combatant. Medical support only.",kc:["Medical support during and after the American arc","Intelligence gathering during the Senku-girlfriend operation","Provided knowledge of Xeno's colony structure and resources"],s:{i:65,c:10,u:65,l:25,ch:65},sk:["Medicine","Medical care","Infiltration (social)","Emotional grounding","Knowledge of American colony"],w:"Non-combatant. Limited outside medical contexts."},
  {n:"Max & Carlos",i:"MC",bg:"#C0DD97",fg:"#3B6D11",g:"American Coalition",j:"Chapter 215",st:"Active",r:"Support Members",arch:"Ensemble Support",q:["— (Reliable crew members)"],ov:"Max and Carlos are American Colony members who become part of the extended Kingdom coalition. Both are reliable additions to the crew during the later phases of the mission.",per:"Earnest and crew-minded. They integrate into the Kingdom's culture without drama.",cr:"General combat support.",kc:["Crew duties aboard the Perseus and later vessels","General labor and support across late-arc missions"],s:{i:40,c:55,u:50,l:20,ch:45},sk:["General combat","Manual labor","Crew cohesion","Adaptability"],w:"Limited individual specialization."},
  // ISS CREW
  {n:"Byakuya Ishigami",i:"BI",bg:"#CECBF6",fg:"#3C3489",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased",r:"Founder of Ishigami Village & Architect of the Future",arch:"The Loving Father",q:["\"I'm cheering for you, Senku.\"","\"If you're serious, you can accomplish anything through diligent application of science.\"","\"I'll bring you back home a mountain of scientific souvenirs from space!\""],ov:"Byakuya Ishigami is the unsung hero of Dr. Stone. An astronaut aboard the ISS when the petrification event struck Earth, he and his small crew were spared. He watched from orbit as humanity was turned to stone, then made a decision: return to Earth, live a human life, found a village, and leave behind everything Senku would need to find. He encoded all of humanity's critical knowledge into the 100 Tales and raised a generation of people who would pass them down faithfully. He never met Senku again. He just trusted him.",per:"Warm, cheerful, and deeply devoted to Senku despite not being his biological father. His faith in Senku, expressed across millennia, is what made the Kingdom of Science possible. His final message to Senku encoded in the 100 Tales is one of the most emotional moments in the series.",cr:"Non-combatant. His contributions were made entirely before the story begins.",kc:["Founded Ishigami Village as a civilization seed for Senku to find","Encoded the 100 Tales with medicine, chemistry, physics, and critical knowledge","Ensured the survival of a lineage that would reach Senku across 3,700 years","Returned safely from the ISS despite all odds and lived a full human life for Senku's sake","His love for Senku is the emotional engine of the entire story"],s:{i:78,c:20,u:100,l:80,ch:90},sk:["Astronautics","Foresight","Encoded knowledge transmission","Parenting","Leadership","Long-term planning","Music (emotional legacy)"],w:"Deceased. All contributions were made before the story's timeline."},
  {n:"Lillian Weinberg",i:"LI",bg:"#F4C0D1",fg:"#72243E",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"Pop Star, Morale Officer & Cultural Legacy",arch:"The Voice That Echoed 3,700 Years",q:["\"Space is beautiful, but so is every person on Earth.\""],ov:"Lillian Weinberg was a world-famous pop star aboard the ISS as a civilian passenger when the petrification event struck. As the only non-scientist in the crew, her role was immediately clear: she was the heart. Her music and spirit kept the group together during the return to a petrified Earth. Her songs passed down through generations — unknowingly becoming a pivotal piece of intelligence 3,700 years later when Gen used her voice to authenticate the Lillian impersonation to Nikki.",per:"Vibrant, compassionate, and deeply human. Lillian understood that in the face of apocalyptic hopelessness, joy and beauty were not luxuries — they were survival tools. Her warmth and music were the glue that held the founding generation together.",cr:"Non-combatant. Her contribution was entirely emotional and cultural.",kc:["Kept the ISS crew's morale intact during the return to a petrified Earth","Her music and spirit were encoded in Ishigami Village's cultural traditions across 3,700 years","Her distinctive voice became the linchpin of Gen's Tsukasa deception","Her songs were the emotional foundation of Ishigami Village's culture","Represents the argument that culture and art are as essential to civilization as science"],s:{i:48,c:5,u:75,l:40,ch:100},sk:["Singing","Performance","Emotional leadership","Morale","Cultural transmission","Empathy","Inspiration"],w:"No scientific or combat contribution. Her impact was entirely cultural and posthumous."},
  {n:"Connie Lee",i:"CL",bg:"#C0DD97",fg:"#3B6D11",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Crew Member & Village Co-Founder",arch:"The Steadfast Crewmate",q:["— (One of the five who chose to return)"],ov:"Connie Lee was a member of the ISS crew who survived the petrification event. When the crew voted to return to Earth rather than stay safely in orbit, Connie was among those who chose to go back. She lived out her life as one of the founding members of Ishigami Village, contributing to the construction of a community that would last 3,700 years.",per:"Resolute and committed. The act of choosing to return to a petrified Earth when you could have stayed in orbit says everything about who Connie was. Grounded, practical, and deeply invested in the survival of her crewmates and the future of humanity.",cr:"Non-combatant.",kc:["Returned to Earth with Byakuya and helped establish the founding community","Contributed to the early years of what became Ishigami Village","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:62,c:20,u:65,l:45,ch:55},sk:["Astronautics","Crisis resilience","Community building","Practical problem-solving","Teamwork","Commitment"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  {n:"Darya Nikitina",i:"DN",bg:"#CECBF6",fg:"#3C3489",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Cosmonaut & Village Co-Founder",arch:"The Iron Cosmonaut",q:["— (Strength of will, strength of hands)"],ov:"Darya Nikitina was a Russian cosmonaut aboard the ISS who survived the petrification event. Highly trained in space station systems, engineering, and survival procedures, she was one of the crew's most technically capable members. Her engineering background contributed to the founding generation's ability to establish a sustainable community upon returning to Earth.",per:"Stoic, capable, and deeply pragmatic. Darya was the kind of person who assesses a crisis, identifies what needs to be done, and does it without complaint.",cr:"Non-combatant.",kc:["Technical and engineering contributions to the early Ishigami Village founding","ISS systems expertise assisted with descent and Earth re-entry planning","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:70,c:25,u:72,l:52,ch:48},sk:["Aerospace engineering","ISS systems","Survival skills","Technical problem-solving","Physical conditioning","Crisis management"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  {n:"Shamil Volkov",i:"SV",bg:"#D3D1C7",fg:"#444441",g:"ISS Crew (Founding Generation)",j:"Pre-story",st:"Deceased (lived full life)",r:"ISS Cosmonaut & Village Co-Founder",arch:"The Reliable One",q:["— (Steady hands when it mattered most)"],ov:"Shamil Volkov was a Russian cosmonaut aboard the ISS who survived the petrification event. Together with Darya Nikitina, he represented the Russian cosmonaut contingent of the crew. His training in spacecraft systems, physical conditioning, and survival procedures made him an invaluable member of the founding generation.",per:"Warm, steady, and deeply reliable. Shamil was the kind of crew member everyone wanted in an emergency — calm, experienced, and capable. A stabilizing presence during the terrifying weeks following the petrification event.",cr:"Non-combatant.",kc:["Physical labor and practical skills during the founding of Ishigami Village","Spacecraft and survival systems knowledge assisted early Earth re-adaptation","One of the five humans responsible for the existence of the Kingdom of Science"],s:{i:65,c:30,u:68,l:48,ch:60},sk:["Aerospace systems","Physical conditioning","Survival skills","Teamwork","Emotional steadiness","Reliability"],w:"Deceased. Contributions were made entirely before the story's timeline."},
  {n:"Mirai Shishio",i:"MI",bg:"#9FE1CB",fg:"#085041",g:"Defectors",j:"Chapter 130",st:"Active",r:"Tsukasa's Sister & Kingdom Companion",arch:"The Reason — Now Revived",q:["— (Her existence changed the entire story)"],ov:"Mirai is Tsukasa's terminally ill younger sister. Tsukasa's entire ideology — his war against adults, his willingness to kill, his conflict with Senku — was rooted in the desire to revive her in a safe world. The Kingdom's medicine healed her, transforming Tsukasa from enemy to ally; she is now revived as an active member of the Kingdom, traveling alongside Nikki Hanada who has taken on the role of her caretaker and friend.",per:"Gentle, sweet, and almost entirely free of the darkness that defined her brother's path. She understands what Tsukasa did for her — and she grieves it.",cr:"Non-combatant. No combat role.",kc:["Her existence was the root cause of the Kingdom's first war","Her recovery through Kingdom medicine was the inflection point of Tsukasa's redemption","Proved the Kingdom's medical capabilities dramatically","Now an active member of the Kingdom of Science, accompanying Nikki Hanada"],s:{i:40,c:5,u:30,l:10,ch:70},sk:["Emotional significance","Tsukasa's anchor","Symbol of peaceful future","Gentleness"],w:"Non-combatant. Limited operational role; primary contribution is presence and companionship."},
];

const GROUPS=["All",...new Set(M.map(m=>m.g))];
let activeGroup="All",query="",mode="grid",sortStat="overall";

function overall(m){const s=m.s;return Math.round((s.i+s.c+s.u+s.l+s.ch)/5);}
function getVal(m,stat){const map={intelligence:"i",combat:"c",utility:"u",leadership:"l",charisma:"ch"};return stat==="overall"?overall(m):m.s[map[stat]];}

function initFilters(){
  const fr=document.getElementById("filters");
  GROUPS.forEach(g=>{
    const p=document.createElement("button");
    p.className="pill"+(g==="All"?" active":"");
    p.textContent=g;
    p.onclick=()=>{activeGroup=g;document.querySelectorAll(".pill").forEach(e=>e.classList.remove("active"));p.classList.add("active");render();};
    fr.appendChild(p);
  });
}

function setMode(m){
  mode=m;
  document.getElementById("btn-grid").classList.toggle("active",m==="grid");
  document.getElementById("btn-rank").classList.toggle("active",m==="rank");
  document.getElementById("sort-wrap").style.display=m==="rank"?"block":"none";
  render();
}

const sortClsMap={overall:"overall",intelligence:"intel",combat:"combat",utility:"utility",leadership:"lead",charisma:"charisma"};
function setSort(s){
  sortStat=s;
  document.querySelectorAll("[id^='sort-']").forEach(b=>{
    b.classList.remove("active","overall","intel","combat","utility","lead","charisma");
  });
  const btn=document.getElementById("sort-"+s);
  if(btn) btn.classList.add("active",sortClsMap[s]);
  render();
}

function getFiltered(){
  query=document.getElementById("search").value.toLowerCase();
  return M.filter(m=>{
    const mg=activeGroup==="All"||m.g===activeGroup;
    const ms=!query||m.n.toLowerCase().includes(query)||m.r.toLowerCase().includes(query)||m.sk.some(s=>s.toLowerCase().includes(query))||m.g.toLowerCase().includes(query);
    return mg&&ms;
  });
}

function render(){
  const f=getFiltered();
  document.getElementById("count").textContent=f.length+" member"+(f.length!==1?"s":"")+" shown";
  const el=document.getElementById("content");
  if(!f.length){el.innerHTML='<div class="empty">No members found.</div>';return;}

  if(mode==="grid"){
    el.innerHTML=`<div class="grid">${f.map(m=>`
      <div class="card" onclick="showDetail(${M.indexOf(m)})">
        <div class="card-top">
          <div class="av" style="background:${m.bg};color:${m.fg}">${m.i}</div>
          <div><div class="card-name">${m.n}</div><div class="card-role">${m.r}</div></div>
        </div>
        <div>${m.sk.slice(0,3).map(s=>`<span class="badge">${s}</span>`).join("")}${m.sk.length>3?`<span class="badge">+${m.sk.length-3}</span>`:""}</div>
      </div>`).join("")}</div>`;
  } else {
    const sorted=[...f].sort((a,b)=>getVal(b,sortStat)-getVal(a,sortStat));
    const color=SC[sortStat];
    const label=sortStat==="overall"?"Overall":sortStat.charAt(0).toUpperCase()+sortStat.slice(1);
    el.innerHTML=`<div class="rank-list">${sorted.map((m,i)=>{
      const val=getVal(m,sortStat);
      const nc=i===0?"rnum gold":i===1?"rnum silver":i===2?"rnum bronze":"rnum";
      const med=i===0?"🥇":i===1?"🥈":i===2?"🥉":"";
      return`<div class="rank-row" onclick="showDetail(${M.indexOf(m)})">
        <div class="${nc}">${med||"#"+(i+1)}</div>
        <div class="rav" style="background:${m.bg};color:${m.fg}">${m.i}</div>
        <div class="rinfo"><div class="rname">${m.n}</div><div class="rrole">${m.r}</div></div>
        <div class="rright">
          <div class="rscore" style="color:${color}">${val}</div>
          <div class="rbarbg"><div class="rbar" style="width:${val}%;background:${color}"></div></div>
          <div class="rlabel">${label}</div>
        </div>
      </div>`;
    }).join("")}</div>`;
  }
}

function sB(label,val,key,highlight){
  const c=highlight?(SC[key]||barC(val)):barC(val);
  const bdr=highlight?`border-color:${c};`:"";
  return`<div class="sbox" style="${bdr}">
    <div class="slbl">${label}</div>
    <div class="sval" style="color:${c}">${val}/100</div>
    <div class="bbg"><div class="bfill" style="width:${val}%;background:${c}"></div></div>
  </div>`;
}

function showDetail(idx){
  const m=M[idx];const s=m.s;const ov=overall(m);
  document.getElementById("panel").innerHTML=`
    <div class="ph">
      <div class="lgav" style="background:${m.bg};color:${m.fg}">${m.i}</div>
      <div><div class="pname">${m.n}</div><div class="pmeta">${m.arch} · ${m.g} · Joined: ${m.j} · Status: ${m.st}</div></div>
    </div>
    <div class="sec">Overview</div><p class="desc">${m.ov}</p>
    <div class="sec">Personality</div><p class="desc">${m.per}</p>
    <div class="sec">Combat role</div><p class="desc">${m.cr}</p>
    <div class="sec">Signature quote${m.q.length>1?"s":""}</div>${m.q.map(q=>`<div class="quote">${q}</div>`).join("")}
    <div class="sec">Stat ratings — Overall: ${ov}/100</div>
    <div class="sgrid">
      ${sB("Intelligence",s.i,"intelligence",sortStat==="intelligence")}
      ${sB("Combat",s.c,"combat",sortStat==="combat")}
      ${sB("Utility",s.u,"utility",sortStat==="utility")}
      ${sB("Leadership",s.l,"leadership",sortStat==="leadership")}
      ${sB("Charisma",s.ch,"charisma",sortStat==="charisma")}
    </div>
    <div class="sec">Key contributions</div>
    ${m.kc.map(k=>`<div class="km">· ${k}</div>`).join("")}
    <div class="sec">Strengths & skills</div>
    <div>${m.sk.map(s=>`<span class="chip">${s}</span>`).join("")}</div>
    <div class="sec">Notable weakness</div><p class="desc">${m.w}</p>
    <button class="closebtn" onclick="closePanel()">Close</button>`;
  document.getElementById("overlay").classList.add("open");
}

function maybeClose(e){
  if(e.target===document.getElementById("overlay")) closePanel();
}
function closePanel(){
  document.getElementById("overlay").classList.remove("open");
}

initFilters();
setSort("overall");
render();
</script>
</body>
</html>
