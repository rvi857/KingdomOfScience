<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingdom of Science — Full Roster</title>
<style>
[data-theme="light"] {
  --bg0:#f0f2f5; --bg:#ffffff; --bg2:#f3f4f6; --bg3:#e5e7eb;
  --bg-info:#eff6ff; --bg-quote:#f0f7ff;
  --t1:#111827; --t2:#4b5563; --t3:#9ca3af; --ti:#1d4ed8;
  --b1:#e5e7eb; --b2:#d1d5db; --bi:#93c5fd;
  --shadow:rgba(0,0,0,.07); --overlay:rgba(0,0,0,.4);
  --km-border:#d1d5db;
}
[data-theme="dark"] {
  --bg0:#0d1117; --bg:#161b22; --bg2:#21262d; --bg3:#30363d;
  --bg-info:#1c2a3a; --bg-quote:#192030;
  --t1:#e6edf3; --t2:#8b949e; --t3:#484f58; --ti:#79c0ff;
  --b1:#30363d; --b2:#3d444d; --bi:#1f6feb;
  --shadow:rgba(0,0,0,.4); --overlay:rgba(0,0,0,.7);
  --km-border:#30363d;
}

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg0);min-height:100vh;padding:1.5rem;color:var(--t1);transition:background .3s,color .3s}

.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:1.25rem;gap:1rem}
.header h1{font-size:22px;font-weight:700;color:var(--t1)}
.header p{font-size:13px;color:var(--t3);margin-top:3px}

.toggle{display:flex;align-items:center;gap:8px;padding:7px 15px;border-radius:20px;border:1px solid var(--b2);background:var(--bg2);color:var(--t2);cursor:pointer;font-size:13px;font-family:inherit;white-space:nowrap;flex-shrink:0;transition:background .2s,border-color .2s,color .2s}
.toggle:hover{border-color:var(--t3)}
.toggle-icon{font-size:15px;line-height:1}

.controls{background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:1rem 1.25rem;margin-bottom:1rem;box-shadow:0 1px 4px var(--shadow);transition:background .3s,border-color .3s}

.search input{width:100%;padding:9px 13px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);font-size:14px;font-family:inherit;margin-bottom:.9rem;outline:none;transition:background .3s,border-color .2s,color .3s}
.search input:focus{border-color:var(--bi);background:var(--bg)}
.search input::placeholder{color:var(--t3)}

.row-label{font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px}
.btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.85rem}

.btn{padding:5px 13px;border-radius:20px;font-size:12px;border:1px solid var(--b2);cursor:pointer;background:var(--bg2);color:var(--t2);font-family:inherit;transition:all .15s}
.btn:hover{border-color:var(--t3)}
.btn.active{background:var(--bg-info);color:var(--ti);border-color:var(--bi);font-weight:600}

[data-theme="light"] .btn.active.combat   {background:#fde8e8;color:#c0392b;border-color:#c0392b}
[data-theme="light"] .btn.active.utility  {background:#e8f9f2;color:#1D9E75;border-color:#1D9E75}
[data-theme="light"] .btn.active.lead     {background:#fef3e8;color:#BA7517;border-color:#BA7517}
[data-theme="light"] .btn.active.charisma {background:#f3e8fe;color:#7C3AED;border-color:#7C3AED}
[data-theme="light"] .btn.active.intel    {background:#e8f0fe;color:#1a56cc;border-color:#1a56cc}

[data-theme="dark"] .btn.active.combat   {background:#3d1212;color:#f87171;border-color:#7f1d1d}
[data-theme="dark"] .btn.active.utility  {background:#0d2e1e;color:#34d399;border-color:#065f46}
[data-theme="dark"] .btn.active.lead     {background:#2e1f05;color:#fbbf24;border-color:#78350f}
[data-theme="dark"] .btn.active.charisma {background:#1f0d3a;color:#c084fc;border-color:#6b21a8}
[data-theme="dark"] .btn.active.intel    {background:#0d1b38;color:#60a5fa;border-color:#1e3a8a}

.filter-row{display:flex;flex-wrap:wrap;gap:5px}
.pill{padding:4px 11px;border-radius:20px;font-size:11px;border:1px solid var(--b2);cursor:pointer;background:var(--bg2);color:var(--t2);font-family:inherit;transition:all .15s}
.pill.active{background:var(--bg-info);color:var(--ti);border-color:var(--bi);font-weight:600}

.count{font-size:12px;color:var(--t3);margin:.6rem 0}

/* GRID */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.card{background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:1rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .3s}
.card:hover{border-color:var(--b2);box-shadow:0 2px 10px var(--shadow)}
.card-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.card-name{font-size:13px;font-weight:600;color:var(--t1);line-height:1.3}
.card-role{font-size:11px;color:var(--t2);margin-top:1px}
.badge{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;margin:2px 2px 0 0;background:var(--bg2);color:var(--t2);border:1px solid var(--b1);transition:background .3s}

/* RANK */
.rank-list{display:flex;flex-direction:column;gap:6px}
.rank-row{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--b1);border-radius:14px;padding:.65rem 1rem;cursor:pointer;transition:border-color .15s,background .3s}
.rank-row:hover{border-color:var(--b2)}
.rnum{font-size:13px;font-weight:700;color:var(--t3);width:28px;text-align:center;flex-shrink:0}
.rnum.gold{color:#f5a623}.rnum.silver{color:#9ca3af}.rnum.bronze{color:#cd7f32}
.rav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.rinfo{flex:1;min-width:0}
.rname{font-size:13px;font-weight:600;color:var(--t1)}
.rrole{font-size:11px;color:var(--t2)}
.rright{display:flex;flex-direction:column;align-items:flex-end;gap:3px;min-width:82px}
.rscore{font-size:17px;font-weight:700}
.rbarbg{width:82px;height:5px;background:var(--bg3);border-radius:3px}
.rbar{height:5px;border-radius:3px}
.rlabel{font-size:10px;color:var(--t3)}

/* PANEL */
.overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;align-items:flex-start;justify-content:center;padding:1.5rem;overflow-y:auto}
.overlay.open{display:flex}
.panel{background:var(--bg);border-radius:14px;border:1px solid var(--b1);padding:1.75rem;max-width:580px;width:100%;margin:auto;box-shadow:0 8px 40px var(--shadow);transition:background .3s,border-color .3s}
.ph{display:flex;align-items:center;gap:14px;margin-bottom:1.25rem}
.lgav{width:60px;height:60px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
.pname{font-size:21px;font-weight:700;color:var(--t1)}
.pmeta{font-size:12px;color:var(--t3);margin-top:3px}
.sec{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.07em;margin:1.1rem 0 .45rem}
.desc{font-size:13px;color:var(--t2);line-height:1.75}
.chip{display:inline-block;background:var(--bg2);border:1px solid var(--b1);border-radius:6px;padding:3px 9px;font-size:12px;color:var(--t2);margin:2px;transition:background .3s}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:.5rem}
.sbox{background:var(--bg2);border-radius:8px;padding:.65rem .85rem;border:1px solid transparent;transition:background .3s}
.slbl{font-size:10px;color:var(--t3);margin-bottom:2px}
.sval{font-size:13px;font-weight:700}
.bbg{margin-top:.3rem;height:4px;background:var(--b1);border-radius:2px}
.bfill{height:4px;border-radius:2px}
.quote{border-left:3px solid var(--bi);padding:.6rem .9rem;margin:.5rem 0;font-size:13px;color:var(--t1);font-style:italic;line-height:1.6;font-weight:500;background:var(--bg-quote);border-radius:0 6px 6px 0;transition:background .3s}
.km{background:var(--bg2);border-radius:8px;padding:.6rem .9rem;font-size:12px;color:var(--t2);margin:3px 0;line-height:1.55;border-left:3px solid var(--km-border);transition:background .3s}
.closebtn{margin-top:1.25rem;width:100%;padding:9px;border-radius:8px;border:1px solid var(--b2);background:var(--bg2);color:var(--t1);cursor:pointer;font-size:13px;font-family:inherit;font-weight:500;transition:background .15s}
.closebtn:hover{background:var(--bg3)}
.empty{text-align:center;color:var(--t3);padding:2.5rem;font-size:14px}
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚗️ Kingdom of Science — Full Roster</h1>
    <p>Dr. Stone · Click any member to view their full profile</p>
  </div>
  <button class="toggle" onclick="toggleTheme()" id="toggle-btn">
    <span class="toggle-icon" id="t-icon">🌙</span>
    <span id="t-label">Dark mode</span>
  </button>
</div>

<div class="controls">
  <div class="search"><input type="text" id="search" placeholder="Search by name, role, or skill..." oninput="render()"></div>
  <div class="row-label">View</div>
  <div class="btn-row">
    <button class="btn active" id="btn-grid" onclick="setMode('grid')">Grid</button>
    <button class="btn" id="btn-rank" onclick="setMode('rank')">Ranking</button>
  </div>
  <div id="sort-wrap" style="display:none">
    <div class="row-label">Sort by stat</div>
    <div class="btn-row">
      <button class="btn active" id="sort-overall"      onclick="setSort('overall')">Overall</button>
      <button class="btn intel"  id="sort-intelligence" onclick="setSort('intelligence')">Intelligence</button>
      <button class="btn combat" id="sort-combat"       onclick="setSort('combat')">Combat</button>
      <button class="btn utility" id="sort-utility"     onclick="setSort('utility')">Utility</button>
      <button class="btn lead"    id="sort-leadership"  onclick="setSort('leadership')">Leadership</button>
      <button class="btn charisma" id="sort-charisma"   onclick="setSort('charisma')">Charisma</button>
    </div>
  </div>
  <div class="row-label">Filter by group</div>
  <div class="filter-row" id="filters"></div>
</div>

<div class="count" id="count"></div>
<div id="content"></div>

<div class="overlay" id="overlay" onclick="maybeClose(event)">
  <div class="panel" id="panel"></div>
</div>

<script>
// ── THEME ──────────────────────────────────────────────
function toggleTheme(){
  const html=document.documentElement;
  const dark=html.getAttribute("data-theme")==="dark";
  const next=dark?"light":"dark";
  html.setAttribute("data-theme",next);
  document.getElementById("t-icon").textContent=next==="dark"?"☀️":"🌙";
  document.getElementById("t-label").textContent=next==="dark"?"Light mode":"Dark mode";
  try{localStorage.setItem("ks-theme",next);}catch(e){}
}
(function(){
  try{
    const s=localStorage.getItem("ks-theme");
    if(s){
      document.documentElement.setAttribute("data-theme",s);
      document.getElementById("t-icon").textContent=s==="dark"?"☀️":"🌙";
      document.getElementById("t-label").textContent=s==="dark"?"Light mode":"Dark mode";
    }
  }catch(e){}
})();

// ── COLOURS ────────────────────────────────────────────
const SC={overall:"#378ADD",intelligence:"#1a56cc",combat:"#c0392b",utility:"#1D9E75",leadership:"#BA7517",charisma:"#7C3AED"};
function barC(v){return v>=85?"#1D9E75":v>=65?"#378ADD":v>=40?"#BA7517":"#D85A30";}

// ── DATA ───────────────────────────────────────────────
const M=[
  // CORE FOUNDERS
  {n:"Senku Ishigami",i:"SI",bg:"#B5D4F4",fg:"#0C447C",g:"Core Founders",j:"Chapter 1",st:"Leader",r:"Chief Scientist & Leader",arch:"Genius Strategist",q:["\"This is exhilarating. Get excited!\"","\"It's not that there are things science can't explain. You just look for the rules behind those things. Science is just a name for the steady, pain-in-the-ass effort that goes into that.\"","\"There is no such thing as a 'useless' person in the Kingdom of Science.\"","\"Humanity isn't going down that easily. Two million years of human history is right here inside me.\""],ov:"Adopted son of ISS astronaut Byakuya Ishigami, Senku was already an accomplished amateur scientist by high school — about to help his best friend Taiju confess to Yuzuriha when a mysterious green light petrified all of humanity. He maintained consciousness through 3,700 years of petrification by counting seconds (reaching roughly 116 billion), then self-revived when nitric-acid drip cracked his stone shell in a cave. From three revived friends and zero infrastructure he rebuilt the entire modern tech tree from scratch — gunpowder, glass, antibiotics, electricity, radios, ships, phones, and ultimately a manned rocket to the Moon. He is the Intelligence pillar of the Kingdom's Five Wise Generals — the only person on Earth carrying the complete modern tech tree in his head, capable of sequencing the prerequisite chain from any starting condition to any technological destination.",per:"Outwardly cold and calculating, Senku evolves from a lone scientist who tolerates allies into a leader who actively mentors (Chrome, Suika), delegates command (Ryusui as captain), and explicitly argues for humanity itself as a value. Trademark mannerisms: maniacal grin when a plan works, compulsive time-counting (legacy of petrification), 'ten billion percent' as his certainty intensifier, deflects sincerity with sarcasm, expresses care through feats rather than words. Zero tolerance for superstition and absolute confidence in the scientific method.",cr:"Physically the weakest named character — Kohaku rates him roughly 3/10 for physical ability. He fights with tools, traps, and chemistry: sulfa-based poison gambits, the steam-gun 'Steam Gorilla,' and the climactic 'Hammer of Science' (a steel-chained iron weight he used to disable Hyoga). Loses every straight melee; cannot run from a serious pursuer. When he needs a fighter that even Tsukasa cannot beat, he revives Hyoga as a calculated combat asset. Has survived being stabbed, shot at, and twice petrified — kept alive each time by being too valuable to kill.",kc:["Invented nital revival fluid and founded the Kingdom of Science in Ishigami Village","Reconstructed the modern industrial revolution from memory — gunpowder, glass, antibiotics, electricity, radios, internal combustion, vacuum tubes, photography, tungsten lightbulbs","Engineered Gen's Lillian-impersonation deception that defected huge portions of Tsukasa's army peacefully","Designed and commanded the Perseus, navigating a Pacific-spanning expedition","Survived Ibara's island-wide petrification beam by being the only person who anticipated it and built a counter-position","Engineered his own second revival after Stanley shot and petrified him in the American Saga","Designed and launched a manned rocket to the Moon using Stone World materials","Talked the Why-man AI down with a humanist argument — ending the existential threat without violence","Intelligence pillar and de facto chair of the Five Wise Generals — the only person on Earth holding the complete modern tech tree in his head"],s:{i:100,c:15,u:100,l:85,ch:75},sk:["Chemistry","Physics","Biology","Medicine","Engineering","Electricity","Material science","Astronomy","Mathematics","Tech-tree strategy","Persuasion","Improvisation"],w:"Physically fragile — relies on bodyguards (Kohaku, Taiju, Magma). Emotionally avoidant — struggles with goodbyes, sincerity, and comforting grief, outsourcing empathy to Gen or Chrome. Tunnel vision on technical problems; underestimates pure social/political conflict in early arcs. Tells the truth about his own plans too readily when excited — Gen routinely has to manage his messaging."},
  {n:"Taiju Oki",i:"TO",bg:"#C0DD97",fg:"#3B6D11",g:"Core Founders",j:"Chapter 1",st:"Active",r:"Stamina Powerhouse & Labor Specialist",arch:"Gentle Giant",q:["\"I am in love with Yuzuriha!\"","\"I will do the heavy lifting!\"","\"I don't have the strength to fight, and I don't have the brains to lead. But I have the heart to keep going until the job is done.\""],ov:"Taiju is Senku's best friend since childhood and one of the first humans to be de-petrified. While he possesses no scientific knowledge, his value to the Kingdom is enormous: his endurance is superhuman, he can labor indefinitely without rest, and his unbreakable spirit keeps morale high even in the darkest moments.",per:"Boisterous, earnest, and emotionally intense. He wears his heart on his sleeve — his love for Yuzuriha is his defining motivation. He is honest to a fault and finds it nearly impossible to lie, making him a poor spy but an ideal moral anchor.",cr:"Non-combatant. Refuses to fight people. His sheer physical durability means he can absorb punishment and keep moving in ways others cannot.",kc:["His tears (sodium hydroxide) were the key ingredient in the early revival fluid","Operated nital-soaking on thousands of petrified statues during Tsukasa's Empire phase","Powered early Kingdom labor — clearing land, mixing chemicals, physical construction","Served as Yuzuriha's partner inside Tsukasa's Empire, secretly repairing statues","Emotional foundation of the group during the earliest and hardest chapters"],s:{i:20,c:30,u:85,l:40,ch:75},sk:["Superhuman stamina","Manual labor","Physical endurance","Emotional strength","Honesty","Loyalty"],w:"Cannot fight people — a strict personal code. No scientific knowledge and poor deception ability."},
  {n:"Yuzuriha Ogawa",i:"YO",bg:"#F4C0D1",fg:"#72243E",g:"Core Founders",j:"Chapter 1",st:"Active",r:"Crafting Specialist & Infiltration Operative",arch:"Quiet Mastermind",q:["\"Craft is all about perseverance!\""],ov:"Yuzuriha is often underestimated but is one of the most strategically valuable members of the Kingdom. Her fine motor skills and artistic precision make her the go-to fabricator for delicate tasks. More critically, her emotional intelligence and composure under pressure allowed her to execute one of the most dangerous undercover missions in the series — secretly reassembling petrified statues inside Tsukasa's Empire.",per:"Gentle, composed, and quietly determined. She is deeply in love with Taiju and balances his exuberance with calm steadiness. She can withstand extreme psychological pressure without breaking.",cr:"Non-combatant. Relies on stealth, deception, and allies for protection.",kc:["Secretly repaired thousands of shattered petrified statues inside Tsukasa's Empire","Fabricated thread, rope, and textiles essential to early Kingdom production","Provided Senku with intelligence from deep inside enemy territory","Critical to early clothing and material production"],s:{i:65,c:10,u:80,l:40,ch:60},sk:["Fine motor skills","Weaving & textiles","Infiltration","Composure under pressure","Memory","Artistry","Emotional intelligence"],w:"Limited combat ability. Best utilized in support and stealth roles."},
  // ISHIGAMI VILLAGE
  {n:"Chrome",i:"CH",bg:"#FAC775",fg:"#633806",g:"Ishigami Village",j:"Chapter 10",st:"Active",r:"Field Scientist & Mineral Specialist",arch:"Born Scientist",q:["\"I am a sorcerer!\"","\"Damn! (Yabe!)\"","\"Science is the only way to level the playing field between a genius and a regular person.\"","\"If you can't do it with strength, do it with science. If you can't do it with science, do it with more science!\""],ov:"A Stone-World native of Ishigami Village, Chrome spent roughly a decade roaming the countryside gathering rocks, minerals, and powders into the hut villagers nicknamed the 'sorcerer's shed' — independently reinventing proto-chemistry to entertain children with his 'Rainbow Bridge' flame test. Originally motivated by curing Ruri's mystery illness, he wagered his entire mineral collection against Senku in an arithmetic duel, lost, and conscripted himself into the Kingdom of Science as its first true apprentice. Under Senku's tutelage he rapidly became the Kingdom's second-best scientist, its most capable field operator, and the Creativity pillar of the Five Wise Generals — the only Stone-World native on the strategic council, bringing the native catalog of where to find sulfur, manganese, mercury, and other raw materials that Senku's modern training does not contain, plus an improvisational instinct unfiltered by textbook assumptions.",per:"Energetic, loud, emotional, and impulsive — the perfect counterpoint to Senku's cool rationality. He yells 'Yabe!' (Damn!) at every cool discovery and immediately wants to try it himself. His rivalry with Senku is collaborative envy rather than competition; he wants to match Senku's knowledge, not beat him. Quietly in love with Ruri since childhood — the romance pays off explicitly in the post-Moon Mission arc when he promises to marry her once Senku builds a time machine. Across arcs he evolves from awestruck student into a confident co-architect of the Kingdom.",cr:"Not a trained fighter — loses straight melee even by village standards. Every combat win comes through brain and improvisation: beat Magma in the Grand Bout finals by improvising a convex lens from Suika's watermelon (shaped with his own sweat and tears) to set Magma's clothes on fire; escaped a Tsukasa Empire prison cell by electrolyzing his own sweat with a smuggled battery to produce bleach (wanted acid, got bleach — chemistry wrong, result right); pole-vaulted out of a pitfall-trap field with a single bamboo stick; faked pneumonia with crushed sorrel to ambush a guard. A scrappy non-combatant who survives via science and outrageous bravery.",kc:["Pre-Senku mineral and powder collection that jumpstarted the Kingdom's resource gathering","Won the Grand Bout to gain village authority, formally allying Ishigami Village with the Kingdom of Science","Co-built the Kingdom's first lightbulb, magnet, watermill, iron sword, and gunpowder","Improvised a sweat-electrolysis battery and bleach inside Tsukasa's prison to engineer his own escape and smuggle intel back","First ally Senku revived after Ibara's island-wide petrification — formed the chain that re-revived the entire crew","Tunneled into Xeno's castle and personally captured him during the American Saga","Refused Xeno's offer to defect and co-rule the Stone World, citing Senku's 'never use science to control people' principle","Proposed assembling the rocket in space to bypass weight limits — the design Senku and Xeno adopted for the Moon Mission","Creativity pillar of the Five Wise Generals — the only Stone-World native on the council, providing native resource knowledge and improvisational science Senku's modern training cannot replicate"],s:{i:82,c:30,u:92,l:60,ch:70},sk:["Mineral identification","Field chemistry","Flame tests","Electrolysis","Improvisation","Tunneling","Rapid learning","Bravery","Resource gathering","Problem-solving","Morale"],w:"Physically unimposing — loses straight fights even by village standards. Knowledge has hard gaps; will sometimes lock onto a chemical hypothesis that's wrong (the prison 'acid' was actually bleach). Emotional and impulsive; can be baited or rushed into decisions. Romantically passive — the Ruri arc resolves only at series end. Outside his mineral/chemistry comfort zone he leans heavily on Senku or Kaseki."},
  {n:"Kohaku",i:"KO",bg:"#9FE1CB",fg:"#085041",g:"Ishigami Village",j:"Chapter 10",st:"Active",r:"Defense Division Anchor & Chief Scout",arch:"Lionhearted Fighter",q:["\"I will protect everyone — that is what I decided.\"","\"My blade may find that sharp tongue of yours before either of us knows it.\"","\"I believe in Senku!\"","\"The kind of man I'd fall for is one who follows his ideals — step by step, hammering away no matter how long it takes.\""],ov:"Daughter of Ishigami Village chief Kokuyo and younger sister of priestess Ruri — descended from the original ISS astronauts. The village's strongest warrior and de facto defender, she initially entered the Grand Bout not for power but to keep Ruri out of Magma's hands. Encountered Senku scouting outside the village and became the bridge between the science side and Ishigami; her loyalty unlocked village resources for the Kingdom of Science. For most of the series she remains the Kingdom's primary frontline fighter and chief scout, anchored by eyesight rated 11.0 in-universe. She is structurally passed over for the Five Wise Generals — her lane is the Defense Division (with Kinro and Ginro), execution rather than strategy — but the Kingdom recognizes her separately by selecting her as one of three astronauts on the Moon Mission alongside Senku and Stanley.",per:"Direct, fiery, vocal, never softens her read of a situation; uses unexpectedly elaborate vocabulary as a running gag. Fierce loyalty — will put her life on the line for those she cares about. Surprisingly emotionally perceptive: pegs Senku's character early ('the kind who hammers away at a goal, step by step'), reads Gen and Moz accurately when others miss it. Tomboy/warrior identity, uncomfortable with 'ladylike' performance but capable of it under mission cover. Evolves from village-bound protector into a globally-deployed scout/strike asset who can operate solo in foreign territory.",cr:"Primary frontline fighter and elite scout — speed-and-agility specialist with superhuman strength relative to ordinary villagers. Armed early with twin primitive knives and an orange buckler gifted by her father; later upgrades to a Kaseki-forged katana. Equal-or-better than Kirisame in sparring; survives a duel with Stanley Snyder by evading precision rifle fire. The series is honest about her limits: outmatched by Tsukasa (pinned under a felled tree), Hyoga (handled her, Magma, and Kinro simultaneously), Moz (overwhelmed by his spearmanship), and cornered by Kirisame during the Treasure Island infiltration. Elite, not apex — and the Kingdom's most reliable combatant who is not a former enemy.",kc:["Brought Senku into the Ishigami Village ecosystem; entered the Grand Bout to block Magma from claiming Ruri","Carved the calcite prism that became the sunstone — a fine-motor task only her precision could deliver","Defense Division anchor during the Stone Wars, engaging Hyoga directly and providing the warrior labor that let Senku's tech reach the front","Infiltrated Ibara's harem with Amaryllis to locate the Soyuz capsule and the petrification device on Treasure Island","Strategically allowed herself to be petrified alongside Ginro after broadcasting the truth — trusting Senku to revive them","Part of the Gen/Chrome/Kohaku scouting trio that located the American fortress; survived a duel with Stanley Snyder","Selected as one of three crew for the Moon Mission (Senku, Stanley, Kohaku) — the operational counterpart to the strategic Five Wise Generals council"],s:{i:58,c:90,u:78,l:62,ch:75},sk:["Spear combat","Katana swordsmanship","Hand-to-hand","Scouting & tracking","Eagle-eye vision","Swimming","Wilderness survival","Precision carving","Battlefield intuition","Infiltration"],w:"Emotional investment in allies can cloud judgment — Ruri's safety and Senku's wellbeing repeatedly override tactical caution. Zero scientific literacy; has to be told what tools do. Outclassed by apex martial opponents (Tsukasa, Hyoga, Moz in straight fights). Discomfort with subterfuge requiring femininity — manageable but a friction point. No ranged-weapon training; vulnerable to firearms-era enemies without cover."},
  {n:"Kaseki",i:"KA",bg:"#CECBF6",fg:"#3C3489",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Master Craftsman & Chief Fabricator",arch:"The Artisan",q:["\"Incredible... this is incredible!\"","\"Now you've got me fired up!\""],ov:"Elderly master artisan of Ishigami Village whose name literally means 'fossil' — a self-aware joke about his age. Over 50+ years he personally designed and built much of the village's infrastructure including its bridges, but his obsession with making things drew disdain from other villagers and left him isolated as the village's resident weirdo-genius. Chrome literally tied him up and dragged him to Senku because Kaseki refused to engage with the outsiders; the moment he heard what Senku wanted to build and saw glass for the first time, he tore free of the ropes and burst out of his clothes, revealing an absurdly muscular physique hidden under the frail old-man frame — the 'shirt-bursting' gag that became his visual signature any time he gets engineering-excited. He is the Kingdom's most essential non-scientist: every physical invention Senku designs has to be built by someone, and that someone is almost always Kaseki. From the first glass vessels to the Perseus to the diamond batteries of the Moon Mission, the entire tech tree passes through his hands.",per:"Initially gruff, private, and standoffish — a lonely old artist who was the village outcast in youth. Once activated by a new build, childlike glee at any engineering challenge. Signature reaction pattern: sees a Senku diagram → eyes widen → muscles inflate → clothing explodes → 'Now you've got me fired up!' Yuzuriha despairs at the textile cost. Evolves from village outcast to confident veteran who mentors younger craftsmen and treats every new tool as the best day of his life.",cr:"Non-combatant — never fights as a role. But his craftsman's strength is genuinely formidable in emergencies: hauls massive timbers for the Perseus, manhandles heavy stone and metal stock, snapped his bonds in his introduction. Age caps his endurance, not his peak strength. He was petrified and shattered by Kirisame on Treasure Island with zero resistance — the muscle gag is strength, not fighting skill.",kc:["Founding member of Senku's 'Spartan Crafts Club' — the original Senku/Chrome/Kaseki invention trio","First glassblower in the Stone World — blew functional bulbs on his very first attempt","Built the vacuum tubes that made the radio and cell phone possible","Lead builder of the Perseus, the Kingdom's ocean-going research vessel — his magnum opus","Tungsten melting rig for lightbulb filaments; freeze-dried space food vacuum apparatus; steam-engine and gear precision parts","Petrified and shattered by Kirisame on Treasure Island — rescued and reassembled by Taiju, Ryusui, and Soyuz","Forms a heavy-fabrication duo with Brody Dudley (Xeno's PhD-era industrial engineer) once they meet — Stone Age maestro paired with modern industrial engineer","Built and maintained the diamond batteries powering rocket-era systems; worked alongside Joel installing the petrification device's new battery"],s:{i:65,c:15,u:97,l:35,ch:55},sk:["Glassblowing","Metalworking","Woodworking","Stone carving","Precision fabrication","Structural engineering","Vacuum tube crafting","Shipbuilding","Lathe operation","Rapid prototyping","Material intuition"],w:"Age — endurance is his hard ceiling; cannot sustain long campaigns. Zero combat capacity, completely defenseless under attack (Treasure Island proves it). Dependent on Senku for direction — executes brilliantly but does not originate the scientific roadmap. Single point of failure: for much of the series he is the only person on Earth who can fabricate certain components, and losing him would stall the entire tech tree. Destroys his own clothes constantly — running tax on Yuzuriha's textile output."},
  {n:"Suika",i:"SU",bg:"#B5D4F4",fg:"#0C447C",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Premier Covert Operative & Emotional Heart",arch:"The Underdog",q:["\"I want to be useful!\"","\"Sorry it took so long…\""],ov:"Stone-World native of Ishigami Village, ostracized in her early years for severe nearsightedness ('blurry sickness' as the village calls it) that scared other villagers when she scrunched her face to focus. She wears a hollowed-out watermelon helmet as a crude pinhole lens until Senku grinds proper glass lenses to fit inside it — one of the earliest 'science improves a life' payoffs in the series. Consistently underestimated, she has quietly become the Kingdom of Science's premier covert operative: she carried the solo survival arc that revived Senku single-handedly years after the second global petrification, then served as the linchpin operative of the Petrification Kingdom infiltration, smuggling intel and supplies to captured allies while evading enemy patrols across hostile terrain. Post-timeskip she's apprenticed directly under Senku as a working scientist — 'wanting to be useful' resolved into actual indispensability.",per:"Kind, empathetic to a fault, quietly persistent. Her defining drive is the desire to be useful — initially out of insecurity (she's the village burden), later out of genuine loyalty to the Kingdom of Science. The 'I want to be useful' beat resolves into actual indispensability: she literally restarts civilization in the solo arc. Her bond with Chalk the village dog is the longest-running animal-handler relationship in the series — when she wakes alone after the second petrification, she finds Chalk and his mate Sagara have built a stone wall around the statues to protect them from the elements.",cr:"Non-combatant by choice, but a highly effective covert operative. Her speed, small size, and watermelon disguise let her evade capture in territory where larger or more conventional fighters would be caught. Engages enemies only through avoidance and misdirection. During the Stone Wars she deliberately drew Tsukasa Empire troops away from the village using herself as bait — and got away.",kc:["Solo 'New Stone World' arc: woke alone roughly 7 years after the second global petrification, found Chelsea's statue (→ local map) and Senku's statue (→ three revival-fluid recipes), iterated for years on a bat-guano-based process when faster methods failed, and revived Senku single-handedly — restarting the entire Kingdom of Science from scratch","Linchpin covert operative of the Petrification Kingdom infiltration — rolled herself inside the watermelon helmet as recon disguise; escaped with the mobile lab by 'pretending the rolling lab was an animal'","Stone Wars decoy run — deliberately baited Tsukasa Empire troops away from Ishigami Village to draw heat off the science team, and got away","Smuggled intel and supplies to captured Kingdom members across enemy territory","Animal handler — trusted by wildlife, including her long-running bond with Chalk the village dog; Chalk and his mate Sagara built a stone wall protecting the statues during her years-long solo arc","Local flora and fauna expert — practical naturalist knowledge that Francois explicitly defers to across multiple arcs","Saved Charlotte's life during the American Saga with a nitroglycerine-soaked swab applied to a spider bite","Post-timeskip apprentice scientist under Senku — earned the 'You went beyond even my expectations' commendation from the most demanding scientific judge in the series"],s:{i:72,c:40,u:92,l:40,ch:80},sk:["Covert infiltration","Disguise (watermelon)","Stealth & evasion","Speed & agility","Scouting & recon","Smuggling","Flora & fauna expert","Animal handling","Revival fluid chemistry","Apprentice scientist","Resourcefulness","Resilience"],w:"Physically fragile in direct confrontation — relies on evasion, not engagement. Severe nearsightedness without her watermelon or Senku-ground lenses. Child stature limits anything requiring adult reach or strength in early arcs. Pre-timeskip is scientifically literate by execution rather than design — follows recipes brilliantly but does not originate the chemistry."},
  {n:"Kinro",i:"KI",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Disciplined Guard & Frontline Fighter",arch:"The Rule-Keeper",q:["\"Rules exist for a reason.\"","\"Rules are rules.\""],ov:"Kinro is the elder of the two village guard brothers. An exceptional fighter who becomes significantly more effective once Senku's glasses fix the nearsightedness hampering him his entire life. Defined by rigid adherence to rules and order.",per:"Stoic, dutiful, and stubborn. Takes his responsibilities with absolute seriousness. Beneath the rigid exterior is genuine care for the village and his brother.",cr:"Strong frontline fighter. Specializes in spear combat. Becomes one of the more dangerous fighters in the village after his vision is corrected.",kc:["Defended Ishigami Village as primary guard","Competed in the Grand Bout","Served on the Perseus as a combat operative","His glasses moment is a key example of science improving lives"],s:{i:40,c:75,u:55,l:45,ch:40},sk:["Spear combat","Discipline","Reliability","Guard duty","Physical strength","Loyalty","Adaptability (post-glasses)"],w:"Rigid thinking. Struggles to act outside established rules."},
  {n:"Ginro",i:"GI",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 15",st:"Active",r:"Guard & Reluctant Hero",arch:"Comic Relief with Hidden Depth",q:["\"I don't wanna do this!\"","\"Secret Technique: Leave It To Somebody Else!\""],ov:"Ginro is Kinro's younger brother and the series' most reliable source of comic relief — cowardly, status-obsessed, self-serving, yet somehow keeps ending up in the middle of crucial moments. More capable than he lets on with an unexpected clutch factor.",per:"Vain, dramatic, and self-serving — but ultimately good-hearted. Terrified of danger yet circumstances continue to place him at critical junctures.",cr:"Capable spear fighter, faster than Kinro. His swimming ability becomes plot-critical in the Petrification Kingdom arc.",kc:["Participated in the Grand Bout","Played a key undercover role during the Petrification Kingdom arc","Provides irreplaceable morale via comic relief","Bonded with Matsukaze"],s:{i:35,c:68,u:50,l:20,ch:55},sk:["Spear combat","Speed","Swimming","Improvisation under panic","Comic timing"],w:"Cowardice and self-interest frequently undermine effectiveness."},
  {n:"Ruri",i:"RU",bg:"#F4C0D1",fg:"#72243E",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Village Chief & Living Knowledge Archive",arch:"The Oracle",q:["— (Her value is in what she remembers)"],ov:"Ruri is Kohaku's older sister and the priestess of Ishigami Village. She fulfills her sacred duty: memorizing and passing on the '100 Tales' — stories encoded by Byakuya with the entirety of modern humanity's most important knowledge, designed so Senku would one day decode them.",per:"Gentle, serene, and deeply wise. She carries the weight of the village's spiritual and intellectual legacy without complaint.",cr:"Non-combatant. Her value is entirely knowledge-based.",kc:["Preserved and transmitted the '100 Tales'","Provided historical and scientific context encoded by Byakuya","Served as moral and spiritual center of Ishigami Village","Her recovery via sulfa drugs was the first proof of Senku's medical capabilities"],s:{i:70,c:5,u:78,l:55,ch:75},sk:["100 Tales memorization","Historical knowledge","Spiritual leadership","Medical knowledge (encoded)","Wisdom","Village authority"],w:"Chronically ill before treatment. No combat ability."},
  {n:"Magma",i:"MA",bg:"#F0997B",fg:"#712B13",g:"Ishigami Village",j:"Chapter 35",st:"Active",r:"Heavy Combat Asset & Muscle",arch:"Redeemed Bully",q:["\"I don't get science, but I get hitting things.\"","\"Just kill them.\""],ov:"Magma begins as the primary village antagonist. After his defeat and exposure to the Kingdom's world, he undergoes genuine character growth. Not intelligent in a traditional sense but shrewd, tough, and becomes genuinely loyal over time.",per:"Blunt, straightforward, and initially self-serving. His humor comes from complete honesty about his own motivations and limitations.",cr:"One of the Kingdom's most powerful pure fighters. Enormous physical strength. Useful for mining, tunneling, heavy labor, and close-quarters combat.",kc:["Served as primary heavy combatant","Performed critical mining and tunneling work","Participated in the Perseus voyage","His blunt assessments occasionally cut through overthinking"],s:{i:25,c:80,u:60,l:20,ch:35},sk:["Brute strength","Close combat","Mining","Tunneling","Physical endurance","Intimidation"],w:"Low intelligence and poor strategic thinking. No technical or scientific skills."},
  {n:"Kokuyo",i:"KK",bg:"#D3D1C7",fg:"#444441",g:"Ishigami Village",j:"Chapter 20",st:"Active",r:"Village Elder & Authority Figure",arch:"The Patriarch",q:["— (A man of few words, much respect)"],ov:"Kokuyo is the chief and elder of Ishigami Village, father of Kohaku and Ruri. A large, powerful man who has held the village together through wisdom and authority. Initially resistant to Senku's arrival, he becomes a crucial supporter once he sees what science can do for his people.",per:"Reserved, dignified, and protective. Places the wellbeing of his village above everything. Not easily swayed, meaning his approval carries significant weight.",cr:"Strong for his age. Functions more as an authority figure than an active combatant.",kc:["Legitimized Senku's authority within Ishigami Village","United the village behind the Kingdom of Science","Provided structural leadership during Senku's absences"],s:{i:55,c:60,u:55,l:80,ch:65},sk:["Village authority","Leadership","Wisdom","Community management","Physical strength (historical)"],w:"Not a scientific contributor. Age limits physical capability."},
  // DEFECTORS
  {n:"Gen Asagiri",i:"GA",bg:"#F5C4B3",fg:"#712B13",g:"Defectors",j:"Chapter 40",st:"Active",r:"Mentalist, Negotiator & Psychological Operative",arch:"The Schemer",q:["\"I'm a modern, science-loving sheep.\"","\"Senku-chan~♫\"","\"No matter which one of you falls, I'll be riding the winning horse.\"","\"Forrealz?!? (Jima-de?!?)\"","\"Since before I met you, I've been rather fond of you, Senku-chan — setting aside personal gains.\""],ov:"Pre-petrification, Gen was a TV mentalist celebrity — a Japanese magician who built a career on stage tricks combined with applied psychology. Revived by Tsukasa Shishio as a spy to assess the rumored 'scientist in the woods,' he defected after Senku promised him a cold cola — then returned to Tsukasa and delivered the critical lie that 'Senku is dead,' buying the Kingdom months of unimpeded industrialization. He is the Strategy pillar of the Kingdom's Five Wise Generals — the only trained mentalist on the council, the only member whose primary specialty targets human minds rather than the physical world, and the diplomatic/psychological-warfare organ without which the Kingdom would win every fight but lose every negotiation, infiltration, and recruitment.",per:"Theatrical and performative on the surface — affects a sing-song lilt, calls Senku 'Senku-chan~♫,' flips syllables as a verbal tic ('jima-de' for 'maji-de,' English-localized as 'azy-cray'). Ice-cold under psychological pressure (lies under direct Tsukasa interrogation without his pulse spiking) but openly cowardly under physical danger — will hide, run, and complain about hard labor. Frames himself as a fence-sitter ('I ride the winning horse') that increasingly masks genuine attachment. Reads a room instantly, plays to emotion, manufactures hype and morale on demand.",cr:"Declared non-combatant with zero martial training and minimal physical strength. He shapes battles by removing the need to fight them: stage-magic dazzles primitive populations and enemy soldiers; the Lillian Weinberg satellite-phone gambit dismantled half of Tsukasa's army's morale without a shot fired; tactical forecasting predicts what enemy leaders will do before they do it. In any fight he cannot talk down, he flees.",kc:["Defected from Tsukasa for the promise of a cold cola and immediately delivered the 'Senku is dead' lie that bought the Kingdom months to industrialize","Impersonated Lillian Weinberg over the satellite phone — trained to flawless fidelity by Nikki Hanada — defecting huge portions of Tsukasa's army peacefully","Recognized the Mozu/Ibara rift on the Petrification Kingdom and exploited it to flip Mozu to the Kingdom's side","Engineered the Luna Wright sham-courtship operation — gave the Kingdom legitimate standing inside the American colony through pure psychological engineering","Read Dr. Xeno during the American Saga, appealing to scientific curiosity over loyalty","Proposed the 'offer a gift' diplomacy reframe to the Why-man lunar device, converting a hostile contact into negotiation","Organized the war-paint scar ritual and broadcast morale shows before the Moon Mission's final push","Strategy pillar of the Five Wise Generals — the only mentalist on the council, indispensable for psychological warfare and adversary negotiation where pure science cannot resolve a conflict"],s:{i:82,c:3,u:95,l:65,ch:100},sk:["Manipulation","Cold reading","Deception","Impersonation","Stage magic","Sleight-of-hand","Negotiation","Recruitment","Morale management","Showmanship","Tactical forecasting","Social engineering"],w:"Physical cowardice — useless in any fight that cannot be talked out of. Zero scientific or technical knowledge; cannot contribute to any build, only describe what Senku is doing. Manipulation depends on a target with readable psychology — his edge thins against alien intelligences like Why-man. Avoids hard labor (an in-series running joke). Self-preservation instinct read as untrustworthy by early-arc allies long after his real defection."},
  {n:"Ukyo Saionji",i:"US",bg:"#C0DD97",fg:"#3B6D11",g:"Defectors",j:"Chapter 80",st:"Active",r:"Sonar-Trained Intel Lead & Precision Archer",arch:"The Pacifist Soldier",q:["\"I won't let anyone die — not even the enemy.\"","\"I want to avoid a world where the revived go on killing one another.\""],ov:"A former Maritime Self-Defense Force submariner and sonar operator, Ukyo trained his ears for years to interpret faint underwater acoustic signatures — leaving him with hearing that functions as living biological sonar. Revived by Tsukasa and recruited as the Empire's top archer (their third-strongest fighter behind Tsukasa and Hyoga), he tolerated the regime as the only viable survival path until he suspected Hyoga had deliberately led Empire warriors into the sulfur cave to die. He defected to the Kingdom on a single condition — an explicit 'no deaths' pact with Senku — and has since served as the Kingdom's recon lead, counter-sniper, moral conscience, and the Perception pillar of the Five Wise Generals: the only council member with sonar-grade hearing and master-archer precision, providing recon and non-lethal enforcement essential to Senku's no-deaths ethos.",per:"Genuinely pacifist by conviction, not by squeamishness — always proposes the nonviolent option first and only relents if no alternative exists. Calm, soft-spoken, almost monk-like composure even under combat stress. Quietly perceptive — reads social and tactical situations as cleanly as he reads soundscapes. A principled negotiator: his defection itself was a negotiation, not a surrender, and he extracted moral terms from Senku before flipping sides. Across arcs he evolves from complicit Empire bystander into the moral conscience of the Kingdom of Science.",cr:"Surgical non-lethal archery — aims to disarm, pin, or corner rather than kill, severing ropes and shooting weapons out of hands at extreme range. His hearing serves as targeting: he can hit targets he cannot see, using sound alone. In forests, fog, smoke, or night he is functionally a sniper while everyone else is blind. Distinctly below Kohaku/Tsukasa/Hyoga/Stanley in raw melee, but at range or in any scenario where information beats muscle, arguably the most lethal combatant the Kingdom has. Was the Tsukasa Empire's third-strongest fighter.",kc:["Defected from Tsukasa to the Kingdom on the explicit condition of a no-deaths pact — bringing Empire deployment intel and ending the Stone Wars without the bloodbath Tsukasa's loyalists expected","Provided real-time auditory mapping of Ibara's island-wide petrification beam, giving Senku the timing data needed to counter it","Served as the Kingdom's counter-sniper against Stanley Snyder during the American Saga's Xeno-capture operation","Detected the Why-Man signal from the moon and recognized that its synthetic voice matched Senku's — the inflection point that pivoted the entire series toward the Moon Mission","Multilingual capability that proved valuable during the American Saga","Perception pillar of the Five Wise Generals — the only council member with sonar-grade hearing and master-archer precision, providing recon and non-lethal enforcement essential to the Kingdom's no-deaths ethos"],s:{i:75,c:80,u:92,l:62,ch:62},sk:["Superhuman hearing","Sonar detection","Archery","Non-lethal combat","Recon","Stealth","Counter-sniping","Acoustic analysis","Military training","Multilingual","Situational awareness"],w:"Pacifism as a tactical constraint — hesitates with lethal force, which has cost him windows against enemies (notably Stanley, who has no such constraint). Limited melee capability; would be overwhelmed in close quarters by any of the top fighters. Hearing is a double-edged sword: loud environments, intentional noise floods, or acoustic deception can degrade his edge. Physically not a powerhouse — relies on positioning, cover, and information asymmetry. Was complicit in Tsukasa's regime longer than he should have been — moral hesitation cuts both ways."},
  {n:"Nikki Hanada",i:"NH",bg:"#F4C0D1",fg:"#72243E",g:"Defectors",j:"Chapter 85",st:"Active",r:"Combat Guard & Voice Authentication Specialist",arch:"The Superfan Soldier",q:["\"Lillian Weinberg is a goddess.\""],ov:"Nikki is a powerfully built former MMA fighter. Her most critical contribution was entirely unexpected: she was such a devoted fan of Lillian Weinberg that she could authenticate whether a voice truly sounded like Lillian's — the linchpin of one of Gen's most audacious deceptions.",per:"Tough on the exterior, deeply sentimental beneath. Direct, loyal, and surprisingly emotionally open once she trusts people.",cr:"Powerful physical fighter. MMA background gives her a well-rounded combat skillset. Serves primarily as a guard.",kc:["Authenticated the Lillian voice performance — most critical moment of the anti-Tsukasa arc","Transitioned loyalty of several Empire members to the Kingdom","Reliable front-line guard on expeditions"],s:{i:40,c:78,u:55,l:35,ch:50},sk:["MMA combat","Physical strength","Guard duty","Voice authentication","Loyalty","Emotional conviction"],w:"Limited scientific or strategic value outside of combat."},
  {n:"Minami Hokutozai",i:"MH",bg:"#B5D4F4",fg:"#0C447C",g:"Defectors",j:"Chapter 85",st:"Active",r:"Journalist, Photographer & Media Strategist",arch:"The Documentarian",q:["\"This is the scoop of human history.\""],ov:"Minami understands the power of information and narrative better than almost anyone in the group. She handles all visual documentation of the Kingdom's progress and understands how to frame the Kingdom's story for maximum impact.",per:"Sharp, observant, and professionally focused. Has the journalist's instinct for the telling detail.",cr:"Non-combatant. Her value is informational and archival.",kc:["Manages all photographic and written documentation","Produced communications and propaganda materials","Provided intelligence on Tsukasa's Empire before defecting"],s:{i:68,c:10,u:70,l:30,ch:60},sk:["Photography","Documentation","Media strategy","Information warfare awareness","Journalism","Archiving"],w:"Non-combatant. Support role only."},
  {n:"Yo Uei",i:"YU",bg:"#D3D1C7",fg:"#444441",g:"Defectors",j:"Chapter 85",st:"Active",r:"Guard & Former Police Officer",arch:"The Opportunist",q:["\"I'm just in it for myself — don't get me wrong.\""],ov:"Yo is a former police officer who joined largely because the Kingdom seemed to be winning. Openly self-serving, frequently cowardly, never misses an opportunity to complain — yet consistently pulls through when the situation demands it.",per:"Lazy, sardonic, and aggressively self-interested. The group's most honest mercenary — doesn't pretend to be noble.",cr:"Capable close-quarters fighter with police training. Comfortable with firearms. Serves primarily as a guard.",kc:["Provided guard duty across multiple arcs","Law enforcement instincts useful in tense confrontations","Comic relief that keeps the group's tone balanced"],s:{i:38,c:65,u:52,l:15,ch:40},sk:["Police combat training","Guard duty","Firearms familiarity","Threat assessment","Self-preservation instincts"],w:"Self-serving and unreliable without clear personal stakes."},
  // MODERN REVIVALS
  {n:"Ryusui Nanami",i:"RN",bg:"#FAC775",fg:"#633806",g:"Modern Revivals",j:"Chapter 100",st:"Active",r:"Navigator, Captain & Logistics Commander",arch:"The Aristocrat",q:["\"I want it all — every last bit of this world!\"","\"I desire it!\"","\"I will not give up on anything. Wanting something is justice.\""],ov:"Youngest son of the Nanami Conglomerate patriarch and older half-brother to Sai Nanami, Ryusui was effectively disinherited as a teenager when his father cut his allowance from 100 million yen to 1 million and told him to 'learn to give up' — to which young Ryusui replied that he did not know the meaning of the word. He grew up obsessed with bottled model ships and went on to master every watercraft discipline and sail every ocean. Senku revived him by name during the Age of Exploration arc specifically because the Kingdom needed an elite navigator who could captain the Perseus — built off Ryusui's own 1:48 scale motorized sailboat model — across the Pacific to the source of petrification. He is the Judgement pillar of the Kingdom's Five Wise Generals — the only character with elite navigation, logistics, and resource-prioritization instincts, whose 'I desire it!' drive converts the council's strategy into shippable plans.",per:"Supremely confident, unapologetically hedonistic, perpetually grinning, theatrical captain energy paired with sharp situational read. His defining philosophy 'Desire is Justice / Wanting is Noble' — he refuses to suppress or apologize for any desire and considers hypocrisy about wants the worst weakness. His personal greed paradoxically dovetails perfectly with the Kingdom of Science's expansionist ambition: he wants everything, Senku wants to rebuild everything, alignment is total. Loyalty to his butler Francois — who has served him since age 9 — is absolute and effectively parental.",cr:"Classified as a non-frontline / semi-power type — physically athletic, strong, with good reflexes, but no formal combat training. Held his own in a tug-of-war against Ibara and shielded Suika from a petrification beam with his body during the Petrification Kingdom fight, using a drone to deliver Ibara's own weapon back at him. Explicitly outclassed by trained fighters (Kohaku, Tsukasa, Hyoga, Stanley) and openly conceded marksmanship and combat to Stanley during the Moon Mission astronaut selection — a rare instance of his ego yielding to executive judgment.",kc:["Co-designed the Perseus with Senku — built directly off Ryusui's 1:48 scale motorized sailboat model","Captained the Perseus across the Pacific using non-electronic navigation (celestial, dead-reckoning, current/wind reading)","Founded Dragos ($) — the Stone World's first and only currency, originally backed by Senku's promise of oil and later by Ryusui's Sagara oil field rights","Coined the name 'Why-man' for the source of the morse 'why' transmissions","Self-taught aviation in the New America arc — became regarded as the most skilled pilot in the Stone World until Stanley was revived","Voluntarily benched himself from the Moon Mission and personally chose to revive Stanley as a more capable astronaut — a quietly devastating executive-judgment moment","Continued as chief pilot and logistics commander for the global mission's air and sea operations through the final arc","Judgement pillar of the Five Wise Generals — the only council member with elite navigation/logistics training and the executive drive to turn strategy into shippable plans"],s:{i:78,c:35,u:92,l:80,ch:85},sk:["Navigation","Sailing","Captaincy","Piloting","Ship design","Celestial navigation","Meteorology","Economics","Negotiation","Logistics","Leadership"],w:"Arrogance — assumes he can do anything he wants; occasionally needs to be talked down (the Stanley/moon decision required Senku's nudge). Narrow non-science specialization — useless in a lab; cannot replace Senku, Chrome, Kaseki, or Gen for invention work. Explicitly outclassed in combat by Stone World warriors. Greed as liability — sometimes wants things the Kingdom cannot yet afford; needs Senku and Francois as governors. Visibly devastated at being sidelined from the Moon Mission even though he handled it gracefully."},
  {n:"Francois",i:"FR",bg:"#9FE1CB",fg:"#085041",g:"Modern Revivals",j:"Chapter 100",st:"Active",r:"Butler, Chef & Logistics Master",arch:"The Perfect Servant",q:["\"Leave it to me.\"","\"Desire = Justice!\"","\"Le cours de boulangerie de Francois.\""],ov:"Hired by the Nanami Conglomerate as personal butler to Ryusui Nanami when Ryusui was 9 years old, Francois has served him ever since — effectively raising him in lieu of his actual family. Pre-Stone-World they were already a world-class culinary expert, sought after well beyond the Nanami household. Petrified mid-service (found in a bowing pose) and revived in the Age of Exploration arc as a package deal with Ryusui — Senku's first task after reviving Ryusui as the Kingdom's navigator was reviving Francois so he could have proper logistical and culinary support for the year-plus sea voyage. Their full name, age, nationality, and gender are all canonically unknown; Ryusui never bothered to ask, valuing only their talent and loyalty. Identifies as gender-neutral (they/them).",per:"Perfectly composed, eternally calm — stoic professional demeanor that never visibly cracks. Expresses themselves through quality of cooking, plating, service, and anticipation of needs rather than emotional outbursts. Hyper-observant: tailors drinks to each crew member, comfort foods for the homesick, ice cream specifically to win Luna over, finds Ryusui at the firing range after the Moon Mission rejection and lets him cry. Philosophically aligned with Ryusui on 'Desire = Justice' (the 'Greed is Noble' worldview they jointly defend in Chapter 92).",cr:"Non-combatant — petite build, no martial training, no fighting scenes. Has first-aid skills and exceptional physical endurance (canonically walked two straight days through wilderness to reach Ryusui). The closest thing to combat capability is the endurance feat — they can self-extract from a bad situation on foot, but won't win a fistfight.",kc:["Engineered Goat's Gift Stollen — alcohol-soaked dried fruit bread specifically chosen because alcohol draws out moisture and prevents bacterial growth, giving 10+ months of shelf life. What made the Perseus's trans-Pacific voyage logistically possible","Opened a full bar on the Perseus deck mixing personalized drinks for every crew member, including bespoke non-alcoholic mocktails for those staying sober","Ran 'Le cours de boulangerie de Francois' (Francois's Bread Course) teaching Senku and Ryusui to bake","Cooked the first meal on American soil — gator burgers from the fighter team's hunt","Made ice cream specifically for Luna Wright to thaw her relationship with the Kingdom of Science","Co-wrote and translated a multilingual message to Why-man with Gen — every language they collectively knew","Produced olive oil in Barcelona, then served a full Spanish feast (ajillo sides, fisherman's whim pasta, roasted chicken) as a 'taste of home' for newly-revived locals during the Globetrotting arc"],s:{i:72,c:5,u:90,l:40,ch:70},sk:["Culinary mastery","Logistics & supply","Nutrition science","Food preservation","Bartending & mixology","Crew morale","Hospitality","Multilingual comms","First aid","Observation","Endurance","Organization"],w:"Non-combatant — cannot defend self or others in a fight; needs a protector in dangerous territory. Value almost entirely support-derived: without a principal to serve and a kitchen/supply line to run, their role evaporates. Canonically described as having an 'extremely dependent personality' — identity fused to the butler role, with no known personal history, ambitions, or off-duty self. Petite, low physical presence. Doesn't go to the Moon — when the mission goes off-planet they are left behind by necessity."},
  {n:"Chelsea",i:"CE",bg:"#FAC775",fg:"#633806",g:"Modern Revivals",j:"Chapter 195",st:"Active",r:"Geographer & Global Navigation Expert",arch:"The Scholar",q:["\"I can tell exactly where we are just from the landscape.\"","\"Freaky! (Hentai!)\""],ov:"Chelsea is a modern-era geographer revived for the Kingdom's global ambitions. Her ability to identify locations from terrain features and navigate using landscape knowledge is essential once the group travels to distant regions.",per:"Enthusiastic about geography and terrain in a way others find endearing. Confident in her area of expertise, curious and adaptable.",cr:"Non-combatant.",kc:["Identified terrain and landmarks during international travel","Provided geological analysis to support resource location","Land-based geography expertise complementing Ryusui's maritime focus"],s:{i:72,c:5,u:68,l:25,ch:50},sk:["Geography","Terrain identification","Geological analysis","Land navigation","Landmark recognition","Map-reading"],w:"Narrow specialization. Limited outside geographic contexts."},
  {n:"Sai Nanami",i:"SA",bg:"#B5D4F4",fg:"#0C447C",g:"Modern Revivals",j:"Chapter 180",st:"Active",r:"Mathematics Prodigy & Computing Specialist",arch:"The Human Computer",q:["\"Numbers don't lie — let me work it out.\""],ov:"Sai is Ryusui Nanami's older half-brother and one of the most intellectually gifted people in the series in his specific domain. A prodigious mathematician who can perform calculations of staggering complexity entirely in his head, revived to fill the Kingdom's critical gap in computing power. Before modern computers can be rebuilt, Sai effectively functions as one — providing the manual computation backbone for navigation, astronomy, and engineering calculations across the Kingdom's later arcs.",per:"Socially detached and hyper-focused, but quietly loyal to his half-brother Ryusui in his own understated way. Not arrogant about his gift — he simply does not fully understand why others find calculations difficult. His battlefield is the page; his presence is the calculation that makes everyone else's plans possible.",cr:"Non-combatant. His battlefield is mathematics.",kc:["Provided manual computing power for navigation, astronomy, and engineering calculations across multiple arcs","Enabled precision in the Kingdom's later technological projects (rocketry, telecommunications)","His mental arithmetic replaced entire computational systems during key arcs","Assisted Senku and Xeno with the physics and engineering calculations underpinning the Moon Mission","Half-brother to Ryusui Nanami — the family relationship plays into Ryusui's pre-Stone-World backstory and selection of revival targets"],s:{i:98,c:5,u:85,l:20,ch:38},sk:["Mental arithmetic","Mathematical modeling","Physics calculations","Navigational computing","Astronomical mathematics","Pattern recognition","Precise memory"],w:"Virtually useless outside of mathematics and computing contexts. No combat ability. Limited social agency outside his specialized domain."},
  // FORMER ENEMIES
  {n:"Tsukasa Shishio",i:"TS",bg:"#CECBF6",fg:"#3C3489",g:"Former Enemies",j:"Chapter 130",st:"Active (Kingdom Ally)",r:"Strongest Primate High Schooler & Military Commander",arch:"The Noble Villain Redeemed",q:["\"I want a world where the strong protect the weak.\"","\"I will kill you, Senku. But I will not lie to you.\"","\"You can call it killing, if you want. I'm culling humanity, for the sake of a new world.\"","\"The Stone World is a paradise, untainted by the corruption of the old.\"","\"Senku… your science is truly… 10 billion percent.\""],ov:"Pre-petrification national-level MMA champion known as the 'Strongest High School Primate' — fame extending internationally to the point that even Taiju, who did not watch TV, knew of him. His sister Mirai was rendered clinically brain-dead in an accident, and Tsukasa entered MMA specifically to fund her care. As a young boy he was beaten bloody by a drunk fisherman who claimed to 'own the fishing rights' — the seed of his anarcho-primitivist conviction that adult society protects power over innocence, and that the Stone World is the chance to start over. Revived by Senku and Taiju as necessary muscle against a pride of lions (he killed the pride leader with one punch and skinned it for his cloak), he became the series' first major antagonist when he learned Senku planned to revive every adult — smashing petrified statues and founding the Tsukasa Empire of Might. His arc from sworn enemy to genuine Kingdom ally — turned by Mirai's recovery through Senku's medicine — is one of the story's emotional peaks.",per:"Calm, soft-spoken, dignified, quietly intense — almost never raises his voice. Deeply principled to the point of refusing to lie even to a sworn enemy ('I will kill you, Senku, but I will not deceive you'). Genuinely tender with children and the weak; the horror of his Stone Wars era is the cognitive dissonance — the same hands that murder adult statues gently braid a child's hair. Post-cryosleep his ideology softens but his moral seriousness stays intact; he becomes a loyal protector and frontline commander.",cr:"For most of the series' run he is the single strongest combatant in the Stone World. Killed a lion with one punch; pulverizes solid rock barehanded; one-punched Taiju (famed for absurd durability) to the brink of unconsciousness; stopped Kohaku's full strike with two fingers; hurls a 3-meter log one-handed; cut down a one-ton tree with a single stone-sword strike. Sprints barefoot through dense forest faster than fleeing boars. MMA base layered with Muay Thai, Taekwondo, and judo-like throws. Easily defeated Maya Biggs (fellow modern MMA champion) in the American Saga. The series is honest about his ceiling: he loses one-on-one to a fully-grown Hyoga (Senku has to tag in with a stun gun to finish the fight); Stanley with a rifle defeats both Tsukasa and Hyoga at range. Tier: Tsukasa = apex unarmed (with the late-series Hyoga caveat), Stanley = apex armed.",kc:["Founded the Tsukasa Empire of Might after revival — central antagonist of the Stone Wars","Stone Wars ended in stalemate at his showdown with Senku — Senku's dynamite forced a ceasefire rather than a combat loss for either side","Took a near-fatal spear wound from Hyoga's betrayal mid-arc; Senku put him into cryosleep until the Kingdom developed a working petrification device for healing","Re-revived at the end of Treasure Island after Senku finally had a working petrification device — wounds fully healed, reunited with Mirai","Joined the Perseus voyage and US expedition during the American Saga — decisive in close combat against Stanley's modern-trained soldiers","Re-revived from the global beam specifically for the final phase — stayed Earth-side as frontline protector and tactical commander while Stanley took the Moon Mission seat"],s:{i:72,c:100,u:78,l:90,ch:85},sk:["Master martial artist","Superhuman strength","Stone-breaking fists","Expert hunter","Tactical commander","Charismatic leader","Apex endurance"],w:"Ideological rigidity drove the entire first conflict — could not be reasoned out of his 'cull the adults' doctrine, only leveraged via Mirai's revival. Mirai as both motivation and exploit: anyone who threatens or could save her owns Tsukasa. Vulnerable to firearms and modern weaponry — his body is peak human, not bulletproof. Trust in lieutenants cost him: Hyoga's betrayal landed a near-fatal spear strike. No scientific literacy — understands Senku's threat in the abstract but cannot counter the technology, only the people wielding it."},
  {n:"Hyoga",i:"HY",bg:"#AFA9EC",fg:"#3C3489",g:"Former Enemies",j:"Chapter 145",st:"Provisional",r:"Spear Master & Tactical Combatant",arch:"The Cold Blade",q:["\"Emotions are inefficiencies.\"","\"Proper.\""],ov:"Hyoga is the most technically skilled combatant in the series. Where Tsukasa wins through overwhelming physical superiority, Hyoga wins through perfect technique — his spear work is described as the pinnacle of human martial refinement. He remains morally ambiguous throughout.",per:"Cold, analytical, and almost entirely absent of emotional expression. He views most people as variables in a calculation.",cr:"The most technically refined fighter in the series. His kusarigama-style spear technique is essentially unbeatable in direct combat. Even Tsukasa struggled with him.",kc:["Provides combat assets that can neutralize threats Tsukasa cannot","Tactical analysis improves Kingdom military planning","Key combatant during the Petrification Kingdom arc"],s:{i:80,c:98,u:65,l:60,ch:30},sk:["Spear mastery","Kusarigama technique","Combat tactics","Strategic analysis","Composure","Cold-blooded efficiency"],w:"Morally unreliable — loyalty is conditional on his own calculation."},
  {n:"Homura Momiji",i:"HM",bg:"#F5C4B3",fg:"#712B13",g:"Former Enemies",j:"Chapter 145",st:"Active",r:"Agility Scout & Acrobat",arch:"The Devoted Shadow",q:["— (She follows where Hyoga goes)"],ov:"Homura is Hyoga's devoted subordinate and the series' most mobile character. Her movement style is essentially parkour at an elite level — she can traverse any terrain at speed, scale structures instantly, and disappear into environments.",per:"Quiet, intense, and entirely focused on Hyoga. Independently capable but chooses her allegiance based on where he is.",cr:"Not a power fighter. Value is speed, agility, and stealth. Can outrun almost anyone and create chaos through mobility.",kc:["Serves as the Kingdom's fastest mobile scout","Terrain traversal enables recon in areas others cannot reach","Sabotage and distraction capability"],s:{i:50,c:60,u:72,l:15,ch:40},sk:["Parkour & acrobatics","Speed","Stealth","Terrain traversal","Infiltration","Agility"],w:"Not effective in direct confrontation. Loyalty contingent on Hyoga's direction."},
  // PETRIFICATION KINGDOM
  {n:"Kirisame",i:"KR",bg:"#9FE1CB",fg:"#085041",g:"Petrification Kingdom",j:"Chapter 180",st:"Active",r:"Elite Ranged Warrior & Medusa Device Wielder",arch:"The Honorable Guardian",q:["\"I fight for those I protect — nothing more.\""],ov:"Kirisame is one of the Petrification Kingdom's most formidable warriors and the individual entrusted with wielding the Medusa petrification device in combat. She uses a sling with extraordinary precision — capable of launching the Medusa itself as a projectile weapon, triggering mass petrification events over wide areas with pinpoint timing control. Upon learning of Ibara's deception, she immediately defected and sided with the Kingdom.",per:"Stoic, duty-bound, and deeply honorable. Operates from a strong internal code: she fights for those she is sworn to protect. When Ibara's deception was exposed, she acknowledged the truth and acted on it immediately without rationalization.",cr:"An elite ranged combatant. Her sling technique generates projectile velocities and precision that border on the supernatural. As carrier of the Medusa device she can trigger wide-area petrification offensively. Also a capable close-range fighter.",kc:["Wielded the Medusa petrification device as a battlefield weapon","Launched the Medusa at precise targets across large distances","Immediately defected upon Ibara's betrayal being revealed","Her defection stripped Ibara of his most powerful combat asset","Provided intelligence on Petrification Kingdom operations after defecting"],s:{i:58,c:88,u:80,l:52,ch:55},sk:["Sling mastery","Extreme ranged precision","Medusa device operation","Wide-area petrification deployment","Close combat","Physical conditioning","Tactical discipline","Honor-bound reliability"],w:"Unwavering loyalty to authority figures was weaponized against her by Ibara. Operates best with a clear moral framework."},
  {n:"Soyuz",i:"SO",bg:"#9FE1CB",fg:"#085041",g:"Petrification Kingdom",j:"Chapter 160",st:"Active",r:"Island Guide & Cultural Liaison",arch:"The Local Expert",q:["— (A man seeking to reclaim his home)"],ov:"Soyuz is a native of the island near the Petrification Kingdom living in exile. He provides irreplaceable local knowledge — terrain, customs, internal politics, and the layout of the Petrification Kingdom. He is the rightful heir to the island's leadership.",per:"Reserved and purposeful. He has been carrying the weight of his people's occupation for a long time and simply wants his home back.",cr:"Capable fighter. Joins combat operations during the Petrification Kingdom arc.",kc:["Provided tactical and geographic intelligence on the Petrification Kingdom","Served as cultural translator","Combat operative during island liberation","Rightful claim to leadership legitimized the Kingdom's actions"],s:{i:50,c:65,u:70,l:50,ch:52},sk:["Local geography","Cultural knowledge","Political intelligence","Combat","Leadership (hereditary)"],w:"Knowledge is geographically limited."},
  {n:"Amaryllis",i:"AM",bg:"#F4C0D1",fg:"#72243E",g:"Petrification Kingdom",j:"Chapter 162",st:"Active",r:"Infiltration Specialist & Covert Operative",arch:"The Vengeful Beauty",q:["\"I've been training for this infiltration my whole life.\""],ov:"Amaryllis spent years preparing to infiltrate the Petrification Kingdom's harem to find the petrification device and avenge her village. She trained specifically in beauty, performance, and social manipulation as weapons.",per:"Bold, confident, and driven by deep personal anger channeled into precise, patient action. Vain — she knows exactly how attractive she is and weaponizes it without apology.",cr:"Non-combatant in conventional terms. Her combat is social: seduction, deception, and manipulation.",kc:["Infiltrated the Petrification Kingdom's inner circle","Located and gathered intelligence on the petrification device","Orchestrated cover stories protecting the Kingdom's infiltration team","Disguised and guided Kohaku, Suika, and Ginro into enemy territory"],s:{i:70,c:15,u:82,l:40,ch:92},sk:["Seduction","Social infiltration","Disguise","Manipulation","Bravery","Planning","Makeup & appearance craft"],w:"Physically limited in direct confrontation."},
  {n:"Matsukaze",i:"MZ",bg:"#D3D1C7",fg:"#444441",g:"Petrification Kingdom",j:"Chapter 175",st:"Active",r:"Samurai Warrior & Devoted Protector",arch:"The Ancient Guardian",q:["\"My blade and my life belong to my lord.\"","\"My Lord!\""],ov:"Matsukaze is an ancient samurai petrified over a century ago. Upon revival, he finds a completely alien world yet adapts with remarkable composure. He bonds deeply with Ginro and serves as one of the Kingdom's most skilled melee fighters.",per:"Formal, serious, and deeply honorable. Operates by a centuries-old code applied earnestly to a modern situation. His interactions with Ginro are the series' funniest odd-couple dynamic.",cr:"Elite sword fighter. His swordsmanship reflects a lifetime of serious martial training.",kc:["Elite melee combat operative across the Petrification Kingdom arc","Provides samurai-level sword fighting capability","Emotional anchor for Ginro"],s:{i:50,c:85,u:60,l:45,ch:58},sk:["Sword mastery","Bushido discipline","Absolute loyalty","Physical strength","Combat endurance","Tactical awareness"],w:"The modern world is alien to him. Occasionally too rigid in applying ancient codes."},
  {n:"Moz",i:"MO",bg:"#F0997B",fg:"#712B13",g:"Petrification Kingdom",j:"Chapter 200",st:"Provisional",r:"Elite Combatant & Power Asset",arch:"The Mercenary Titan",q:["\"I fight for whoever gives me the best deal.\""],ov:"Moz is one of the Petrification Kingdom's top warriors and one of the physically most imposing characters in the entire series. His fighting ability is genuinely frightening — operating at a level that even Tsukasa would need to take seriously.",per:"Confident, hedonistic, and openly mercenary. Respects strength above everything. This honesty makes him, paradoxically, somewhat reliable within defined terms.",cr:"One of the Kingdom's most powerful combat assets. Physical strength and fighting skill rival the strongest members. Specializes in spear combat.",kc:["Key combat operative during liberation of the Petrification Kingdom","Neutralized threats other Kingdom fighters would have struggled with","His defection shifted combat balance significantly"],s:{i:45,c:95,u:55,l:35,ch:50},sk:["Elite combat","Spear fighting","Superhuman strength","Speed","Intimidation","Tactical cunning"],w:"Morally unreliable — loyalty is entirely transactional."},
  // AMERICAN COALITION
  {n:"Xeno Houston Wingfield",i:"XH",bg:"#B5D4F4",fg:"#0C447C",g:"American Coalition",j:"Chapter 215",st:"Active (Kingdom Scientist)",r:"Rival Scientist & Science Commander",arch:"The Mirror Genius",q:["\"Science is power — and power belongs to those who wield it wisely.\"","\"Either he's honest to a fault, or the world's greatest liar.\"","\"Science is power. The cleverest among us could rule over the ignorant masses.\"","\"After ten years… we finally get to work together.\""],ov:"American scientist, formerly at NASA where he worked alongside Byakuya Ishigami (Senku's adoptive father) during Byakuya's astronaut training. Years before the petrification, NASA received an unsolicited email from a child proposing rocket-science theories; colleagues dismissed it, and Xeno alone replied — walking young Senku through the experiment and corresponding for years afterward. They met in person once, when young Senku visited Byakuya at NASA. Xeno is Senku's earliest scientific mentor. After the petrification, Xeno was eventually revived in North America, reunited with childhood friend Stanley Snyder, and founded the American Colony — which industrialized into Corn City, a militarized scientific state built on Midwest cornfields (food + alcohol for revival fluid) and Texas-region petroleum, a full tech tier ahead of the Kingdom at first contact. Where Senku democratizes science, Xeno believes it should be wielded by the cleverest to rule the ignorant masses — paralleling Senku's mission with a fundamentally different ideology.",per:"Aristocratic, fastidious, theatrical in speech. Genuinely believes the masses must be ruled by their intellectual superiors — not malicious so much as ideologically certain. Cold rationalist, but capable of warmth toward intellectual equals; holds deep, near-affectionate respect for Senku ('my protégé') even while plotting against him. Treats Stanley as both lifelong friend and weapon — pairing himself (brain) with Stanley (force) as deliberate symbi
